      responses:
        '200':
          description: Work orders for the caller's org.
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        tenant_id:
                          type: string
                        vehicle_id:
                          type: string
                        schedule_id:
                          type: string
                          nullable: true
                        trip_id:
                          type: string
                          nullable: true
                        title:
                          type: string
                        description: '{ type: string }'
                        assignee:
                          type: string
                        vendor:
                          type: string
                        cost_estimate:
                          type: number
                          nullable: true
                        cost_actual:
                          type: number
                          nullable: true
                        status:
                          type: string
                          enum:
                            - open
                            - assigned
                            - in_progress
                            - on_hold
                            - done
                            - cancelled
                        due_at:
                          type: string
                          format: date-time
                          nullable: true
