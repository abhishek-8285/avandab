      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - period_start
                - period_end
              properties:
                period_start:
                  type: string
                period_end:
                  type: string
      responses:
        '201':
          description: Snapshot generated and stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  period_start:
                    type: string
                  period_end:
                    type: string
                  total_trips:
                    type: integer
                  total_co2e_kg:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/esg/trips/{trip_id}:
    get:
      tags:
        - ESG
