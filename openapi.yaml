  /api/v1/drivers/me/commands:
    post:
      tags:
        - Drivers
      summary: Send a driver command
      description: Bearer auth, self only. Idempotent on command_id (defaults to cmd_uuid). type is one of ACCEPT_OFFER, REJECT_OFFER,
        START_TRIP, EN_ROUTE_PICKUP, ARRIVE_PICKUP, ARRIVED_PICKUP, START_LOADING, COMPLETE_LOADING, LOADED, START_DELIVERY,
        IN_TRANSIT, ARRIVE_DELIVERY, ARRIVED_DELIVERY, START_UNLOADING, COMPLETE_TRIP, CANCEL_TRIP, INTERRUPT_TRIP, TRIP_INTERRUPTED.
        payload carries offer_id (accept/reject) or trip_id (transitions; COMPLETE_TRIP optionally enforces POD via pod_required/pod_document_id).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                command_id:
                  type: string
                type:
                  type: string
                payload:
                  type: object
                  additionalProperties: {}
      responses:
        '200':
          description: Command processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  message:
                    type: string
                  trip_id:
                    type: string
                  trip_state:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Command rejected (stale state, expired offer, missing POD).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  message:
                    type: string

