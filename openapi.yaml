                schedule_id:
                  type: string
                trip_id:
                  type: string
                title:
                  type: string
                description: '{ type: string }'
                assignee:
                  type: string
                vendor:
                  type: string
                cost_estimate:
                  type: number
                cost_actual:
                  type: number
                due_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Work order opened.
          content:
            application/json:
              schema:
                type: object
                properties:
