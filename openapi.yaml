                  type: string
                fuel_station_id:
                  type: string
                pump_point_id:
                  type: string
                vehicle_id:
                  type: string
                driver_id:
                  type: string
                trip_id:
                  type: string
                fuel_type:
                  type: string
                opening_reading:
                  type: number
                closing_reading:
                  type: number
                vehicle_odometer:
                  type: number
                rate_per_litre:
                  type: number
                remarks:
                  type: string
                issued_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Fuel issue recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  issue_number:
                    type: string
                  fuel_station_id:
                    type: string
                  vehicle_id:
                    type: string
                  driver_id:
                    type: string
                  trip_id:
                    type: string
                  fuel_type:
                    type: string
                  opening_reading:
                    type: number
                  closing_reading:
                    type: number
                  litres_issued:
                    type: number
                  vehicle_odometer:
                    type: number
                  rate_per_litre:
                    type: number
                  total_cost:
                    type: number
                  issued_at:
                    type: string
                    format: date-time
                  created_by:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fuel-issues/{id}:
