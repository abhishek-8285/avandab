                  properties:
                    id:
                      type: string
                    period_start:
                      type: string
                    period_end:
                      type: string
                    total_trips:
                      type: integer
                    total_distance_km:
                      type: number
                    total_cargo_tkm:
                      type: number
                    total_fuel_litres:
                      type: number
                    total_co2e_kg:
                      type: number
                    avg_co2e_per_tkm:
                      type: number
                    ev_distance_km:
                      type: number
                    bs6_distance_km:
                      type: number
                    bs4_distance_km:
                      type: number
                    created_by:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/esg/snapshots/generate:
    post:
      tags:
        - ESG
      summary: Generate emission snapshot
      description: Requires `esg:write` permission. Body requires `period_start`, `period_end` (YYYY-MM-DD); actor taken from
