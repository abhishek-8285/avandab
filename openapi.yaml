    post:
      tags:
        - Work Orders
      summary: Transition a work order
      description: Requires `maintenance:update` permission. Body `status` must be a known lifecycle value; `done` completes
        via the actor-stamped close path and re-evaluates vehicle resolution. Terminal cards are immutable (409).
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - assigned
                    - in_progress
                    - on_hold
                    - done
                    - cancelled
      responses:
        '200':
          description: Work order after transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  closed_at:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Signed API token returned by `POST /api/v1/auth/token`.

  parameters:
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Page number (1-based).
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
      description: Items per page.
    SearchParam:
      name: search
      in: query
      schema:
        type: string
      description: Free-text search filter.
    StatusParam:
      name: status
      in: query
      schema:
        type: string
      description: Status filter.

  schemas:
    ErrorReport:
      type: object
      properties:
        id: { type: string }
        fingerprint: { type: string }
        timestamp: { type: string, format: date-time, description: Last occurrence (last_seen). }
        request_id: { type: string }
        user_id: { type: string }
        tenant_id: { type: string }
        url: { type: string }
        method: { type: string }
        status_code: { type: integer }
        stack_trace: { type: string }
        message: { type: string }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        environment: { type: string }
        app_version: { type: string }
        occurrences: { type: integer }
        first_seen: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
          description: Client capture payload (breadcrumbs, viewport, source).

    Incident:
      type: object
      properties:
        id: { type: string }
        error_id: { type: string }
        tenant_id: { type: string }
        status: { type: string, enum: [OPEN, ASSIGNED, RESOLVED] }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        created: { type: string, format: date-time }
        assigned_to: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        root_cause: { type: string }

    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user_id:
          type: string
        role:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          description: Only `viewer` is allowed for public registration.
          default: viewer
        vehicle_number:
          type: string

    RegisterResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string

    IDResponse:
      type: object
      properties:
        id:
          type: string

    StatusResponse:
      type: object
      properties:
        status:
          type: string

    CreateBookingRequest:
      type: object
      required: [customer_id, route_id, vehicle_type, passengers, price]
      properties:
        customer_id:
          type: string
        route_id:
          type: string
        pickup_date:
          type: string
          example: "2026-08-20"
          description: |
            Accepts `YYYY-MM-DD`, RFC3339, `YYYY-MM-DD HH:MM`, or
            `YYYY-MM-DD HH:MM:SS`.
        vehicle_type:
          type: string
        passengers:
          type: integer
          minimum: 1
        cargo_weight:
          type: number
          nullable: true
        price:
          type: number
          minimum: 0
        notes:
          type: string

    UpdateBookingRequest:
      allOf:
        - $ref: '#/components/schemas/CreateBookingRequest'

    Booking:
      type: object
      properties:
        id:
          type: string
        booking_number:
          type: string
        customer_id:
          type: string
        route_id:
          type: string
        pickup_date:
          type: string
          format: date-time
        vehicle_type:
          type: string
        passengers:
          type: integer
        cargo_weight:
          type: number
          nullable: true
        price:
          type: number
        notes:
          type: string
        status:
          type: string
          enum: [draft, pending, confirmed, cancelled, completed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BookingList:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        total:
          type: integer
          format: int64

    CreateTripRequest:
      type: object
      required: [route_id, departure_time]
      properties:
        booking_id:
          type: string
          nullable: true
        route_id:
          type: string
        departure_time:
          type: string
          format: date-time
        remarks:
          type: string

    Trip:
      type: object
      properties:
        id:
          type: string
        trip_number:
          type: string
        booking_id:
          type: string
          nullable: true
        driver_id:
          type: string
          nullable: true
        driver_display_id:
          type: string
        driver_first_name:
          type: string
        driver_last_name:
          type: string
        vehicle_id:
          type: string
          nullable: true
        vehicle_registration_number:
          type: string
        vehicle_number:
          type: string
        route_id:
          type: string
        route_source:
          type: string
        route_destination:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [draft, scheduled, assigned, started, reached_pickup, in_transit, delivered, completed, cancelled]
        remarks:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        reached_pickup_at:
          type: string
          format: date-time
          nullable: true
        in_transit_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        close_odometer:
          type: number
          nullable: true

    TripList:
      type: object
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        total:
          type: integer
          format: int64

    CompleteTripRequest:
      type: object
      properties:
        close_odometer:
          type: number
        closed_at:
          type: string
          format: date-time
          description: Driver-reported close date/time (RFC3339, ZMOTM_MMS pp.6-8). Optional; defaults to server time. Future values rejected (400).
        breakdown:
          type: boolean
        breakdown_note:
          type: string

    AssignDriverRequest:
      type: object
      required: [driver_id]
      properties:
        driver_id:
          type: string

    AssignVehicleRequest:
      type: object
      required: [vehicle_id]
      properties:
        vehicle_id:
          type: string

    VehicleProfile:
      type: object
      description: SOP fleet-object master data (IE31 tabs + Vehicle Master).
      properties:
        fleet_class:
          type: string
          enum: [CV, PV, FS, OFS]
        ownership:
          type: string
          enum: [O, C, F, M]
        fleet_number:
          type: string
        description:
          type: string
        manufacturer:
          type: string
        manuf_country:
          type: string
        model:
          type: string
        constr_year_month:
          type: string
        acquisition_value:
          type: number
        acquisition_currency:
          type: string
        acquisition_date:
          type: string
          format: date
        purchase_vendor:
          type: string
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        facility_id:
          type: string
        maint_plant:
          type: string
        planning_plant:
          type: string
        company_code:
          type: string
        business_area:
          type: string
        cost_center:
          type: string
        asset_no:
          type: string
        fleet_object_no:
          type: string
        chassis_no:
          type: string
        vehicle_category:
          type: string
        engine_number:
          type: string
        engine_power:
          type: string
        engine_capacity:
          type: string
        cylinder_count:
          type: integer
        max_speed:
          type: number
        weight:
          type: number
        weight_unit:
          type: string
          enum: [TO, KG]
        load_volume:
          type: number
        volume_unit:
          type: string
        secondary_fuel:
          type: string
        usage_indicator:
          type: string

    Vehicle:
      type: object
      properties:
        id:
          type: string
        registration_number:
          type: string
        vehicle_number:
          type: string
        vehicle_type:
          type: string
        capacity:
          type: integer
        fuel_type:
          type: string
        insurance_expiry:
          type: string
          format: date
        fitness_expiry:
          type: string
          format: date
        permit_expiry:
          type: string
          format: date
        status:
          type: string
        current_mileage:
          type: number
        standard_kmpl:
          type: number
          nullable: true
          description: Fleet KMPL norm for variance flagging (00152, B13).
        blocked:
          type: boolean
        blocked_reason:
          type: string
        rc_expiry:
          type: string
          format: date
          nullable: true
        puc_expiry:
          type: string
          format: date
          nullable: true
        odometer:
          type: number
        profile:
          $ref: '#/components/schemas/VehicleProfile'

    VehicleList:
      type: object
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        total:
          type: integer
          format: int64

    CreateVehicleRequest:
      type: object
      required: [registration_number, vehicle_number, insurance_expiry, fitness_expiry, permit_expiry]
      properties:
        registration_number:
          type: string
        vehicle_number:
          type: string
        vehicle_type:
          type: string
        capacity:
          type: integer
        fuel_type:
          type: string
        insurance_expiry:
          type: string
          format: date
        fitness_expiry:
          type: string
          format: date
        permit_expiry:
          type: string
          format: date
        current_mileage:
          type: number
        standard_kmpl:
          type: number
          nullable: true
          description: Fleet KMPL norm for variance flagging (00152, B13).
        rc_expiry:
          type: string
          format: date
        puc_expiry:
          type: string
          format: date
        odometer:
          type: number
        blocked:
          type: boolean
        blocked_reason:
          type: string
        profile:
          $ref: '#/components/schemas/VehicleProfile'

    UpdateVehicleRequest:
      type: object
      properties:
        registration_number:
          type: string
        vehicle_number:
          type: string
        vehicle_type:
          type: string
        capacity:
          type: integer
        fuel_type:
          type: string
        insurance_expiry:
          type: string
          format: date
        fitness_expiry:
          type: string
          format: date
        permit_expiry:
          type: string
          format: date
        status:
          type: string
        current_mileage:
          type: number
        standard_kmpl:
          type: number
          nullable: true
          description: Fleet KMPL norm for variance flagging (00152, B13).
        blocked:
          type: boolean
        blocked_reason:
          type: string
        rc_expiry:
          type: string
          format: date
        puc_expiry:
          type: string
          format: date
        odometer:
          type: number
        profile:
          $ref: '#/components/schemas/VehicleProfile'

    MeasuringPoint:
      type: object
      properties:
        id:
          type: string
        vehicle_id:
          type: string
        category:
          type: string
        kind:
          type: string
          enum: [ODO, FUEL_TOPUP, PUMP]
        meas_position:
          type: string
        unit:
          type: string
        annual_estimate:
          type: number
        description:
          type: string

    Measurement:
      type: object
      properties:
        id:
          type: string
        point_id:
          type: string
        counter_reading:
          type: number
        difference_reading:
          type: number
        total_counter_reading:
          type: number
        measured_at:
          type: string
          format: date-time
        read_by:
          type: string
        remarks:
          type: string

    RecordMeasurementRequest:
      type: object
      required: [point_id, counter_reading]
      properties:
        point_id:
          type: string
        counter_reading:
          type: number
        measured_at:
          type: string
          format: date
        read_by:
          type: string
        remarks:
          type: string

    GenerateInvoiceRequest:
      type: object
      required: [booking_id, customer_id]
      properties:
        booking_id:
          type: string
        customer_id:
          type: string
        trip_id:
          type: string
          nullable: true
        subtotal:
          type: number
          minimum: 0
        tax:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0

    Invoice:
      type: object
      properties:
        id:
          type: string
        invoice_number:
          type: string
        booking_id:
          type: string
        booking_number:
          type: string
        customer_id:
          type: string
        customer_name:
          type: string
        customer_company:
          type: string
        trip_id:
          type: string
          nullable: true
        trip_number:
          type: string
        subtotal:
          type: number
        tax:
          type: number
        discount:
          type: number
        total:
          type: number
        payment_status:
          type: string
          enum: [pending, paid, partially_paid]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvoiceList:
      type: object
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        total:
          type: integer
          format: int64

    RecordPaymentRequest:
      type: object
      required: [invoice_id, payment_date, amount, method]
      properties:
        invoice_id:
          type: string
        payment_date:
          type: string
          format: date-time
        amount:
          type: number
          exclusiveMinimum: 0
        method:
          type: string
          enum: [cash, upi, bank_transfer, cheque, razorpay]
        reference:
          type: string
          nullable: true
        remarks:
          type: string
          nullable: true

    Payment:
      type: object
      properties:
        id:
          type: string
        invoice_id:
          type: string
        invoice_number:
          type: string
        payment_date:
          type: string
          format: date-time
        amount:
          type: number
        method:
          type: string
          enum: [cash, upi, bank_transfer, cheque, razorpay]
        reference:
          type: string
          nullable: true
        remarks:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentList:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        total:
          type: integer
          format: int64

    ReversePaymentRequest:
      type: object
      required: [original_payment_id, reason]
      properties:
        original_payment_id:
          type: string
        reason:
          type: string

    RazorpayWebhookEvent:
      type: object
      properties:
        event:
          type: string
        payload:
          type: object
          properties:
            payment:
              type: object
              properties:
                entity:
                  type: object
                  properties:
                    id:
                      type: string
                    order_id:
                      type: string
                    amount:
                      type: integer
                      description: Amount in smallest currency unit.
                    currency:
                      type: string
                    status:
                      type: string
                    notes:
                      type: object
                      properties:
                        invoice_id:
                          type: string

    LivePnL:
      type: object
      properties:
        trip_id:
          type: string
        quoted_fare:
          type: number
        fuel_cost:
          type: number
        fuel_cost_low:
          type: number
        fuel_cost_high:
          type: number
        toll_cost:
          type: number
        kharcha_approved:
          type: number
        fuel_consumed_liters:
          type: number
        estimated_margin:
          type: number
        margin_percentage:
          type: number
        margin_low:
          type: number
        margin_high:
          type: number
        low_margin:
          type: boolean
        margin_available:
          type: boolean
        fuel_cost_status:
          type: string
        confidence:
          type: string
        last_update:
          type: string
          format: date-time

    GPSLogPayload:
      type: object
      properties:
        id:
          type: integer
          format: int64
        latitude:
          type: number
        longitude:
          type: number
        timestamp:
          type: string

    SyncBatchRequest:
      type: object
      required: [device_id, logs]
      properties:
        device_id:
          type: string
        driver_id:
          type: string
        logs:
          type: array
          items:
            $ref: '#/components/schemas/GPSLogPayload'

    SyncBatchResponse:
      type: object
      properties:
        success:
          type: boolean
        synced_count:
          type: integer
        synced_ids:
          type: array
          items:
            type: integer
            format: int64
        server_time:
          type: string
          format: date-time

    TelemetrySnapshotPayload:
      type: object
      required: [trip_id, timestamp, latitude, longitude]
      properties:
        id:
          type: string
        trip_id:
          type: string
        vehicle_id:
          type: string
        timestamp:
          type: string
          format: date-time
        latitude:
          type: number
        longitude:
          type: number
        speed:
          type: number
        fuel_level:
          type: number
        odometer:
          type: number

    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
        snapshot_id:
          type: string
        server_time:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient RBAC permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already in the requested state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service unavailable or webhook not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
