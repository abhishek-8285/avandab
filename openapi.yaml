            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Cached or upstream address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  display_name:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/sessions/end:
    post:
      tags:
        - Telemetry
      summary: End driver telemetry session
      description: Bearer auth (driver session). Closes the caller's session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
