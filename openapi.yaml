              properties:
                expense_id:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Transaction reconciled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  reconciliation_status:
                    type: string
