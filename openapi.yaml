              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Session closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/sessions/start:
    post:
      tags:
        - Telemetry
      summary: Start driver telemetry session
      description: Bearer auth (driver session). Binds the session to the driver's active vehicle assignment when present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
