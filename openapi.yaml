          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Work Orders
      summary: Open a work order
      description: Requires `maintenance:create` permission. Opens a job card in `open` status; id/tenant/status are server-owned.
