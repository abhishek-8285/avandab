      responses:
        '200':
          description: SEBI BRSR Principle 6 carbon summary (JSON object or CSV).
          content:
            application/json:
              schema:
                type: object
                properties:
                  reporting_period:
                    type: string
                  scope1_emissions_tonne:
                    type: number
                  scope3_cat4_emissions_tonne:
                    type: number
                  total_emissions_tonne:
                    type: number
                  carbon_intensity_kg_per_km:
                    type: number
                  carbon_intensity_kg_per_tkm:
                    type: number
                  total_distance_km:
                    type: number
                  green_fleet_share_percentage:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/esg/snapshots:
    get:
      tags:
