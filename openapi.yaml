        '200':
          description: Fuel issue logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fuel_issues:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Fuel
      summary: Record a fuel issue
      description: Requires `fuel:create` permission. Requires `fuel_station_id` and `vehicle_id`; `closing_reading` must exceed
        `opening_reading` (litres = close minus open); `fuel_type` defaults to diesel; unknown station/vehicle or expired station
        validity returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fuel_station_id
                - vehicle_id
              properties:
