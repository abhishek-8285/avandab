        - FuelCards
      summary: Register fuel card
      description: Requires `fuel:write` permission. Body requires `card_number`, `provider`; optional vehicle/driver binding
        and `daily_spend_limit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_number
                - provider
              properties:
                card_number:
                  type: string
                provider:
                  type: string
                  enum:
                    - IOCL
                    - BPCL
                    - HPCL
                    - SHELL
                    - FLEET_BANK
                assigned_vehicle_id:
                  type: string
                assigned_driver_id:
                  type: string
                daily_spend_limit:
                  type: number
      responses:
        '201':
          description: Fuel card registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  card_number_masked:
                    type: string
                  provider:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fuel-cards/transactions/sync:
    post:
      tags:
        - FuelCards
      summary: Sync OMC statement feed
      description: Requires `fuel:write` permission. Body requires `transactions` array (external_txn_id, txn_time, station,
        fuel_type, litres, rate, amount).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transactions
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    required:
                      - external_txn_id
                      - txn_time
                      - fuel_station_name
                      - fuel_type
                      - volume_litres
                      - rate_per_litre
                      - total_amount
                    properties:
                      card_number:
                        type: string
                      card_token_hash:
                        type: string
                      external_txn_id:
                        type: string
                      txn_time:
                        type: string
                        format: date-time
                      fuel_station_name:
                        type: string
                      fuel_station_city:
                        type: string
                      fuel_type:
                        type: string
                        enum:
                          - DIESEL
                          - PETROL
                          - CNG
                          - DEF
                          - LUBRICANT
                      volume_litres:
                        type: number
                      rate_per_litre:
                        type: number
                      total_amount:
                        type: number
                      odometer_reported:
                        type: number
                      notes:
                        type: string
      responses:
        '200':
          description: Ingestion outcome with auto-reconciliation counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested_count:
                    type: integer
                  matched_count:
                    type: integer
                  generated_count:
                    type: integer
                  anomaly_count:
                    type: integer
                  transactions:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fuel-cards/transactions/{id}/reconcile:
    post:
      tags:
        - FuelCards
      summary: Manually reconcile transaction
      description: Requires `fuel:write` permission. Path `{id}` is transaction ID; body requires `expense_id`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
