                      - FUEL_PRIMARY
                      - DISTANCE_ACTIVITY
                      - DEFAULT_FACTOR
                  certified_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/experiments:
    get:
      tags:
        - Experiments
      summary: List experiments
      description: Requires `experiments:read` permission. Optional `status` filter (draft, running, paused, completed, archived).
        Fails closed on missing tenant.
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Experiments for the tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiments:
                    type: array
                    items:
                      type: object
                  total:
