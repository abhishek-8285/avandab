          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Drivers
      summary: Report an issue
      description: Bearer auth, self only. Multipart form; message is required; category defaults to other; severity defaults
        to low; photo file optional.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                category:
                  type: string
                  enum:
                    - vehicle
                    - road
                    - cargo
                    - customer
                    - accident
                    - other
                severity:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - critical
                trip_id:
                  type: string
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Issue recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  category:
                    type: string
                  severity:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/license:
    post:
      tags:
        - Drivers
      summary: Submit my driving license
      description: Bearer auth, self only. expires_on is required (YYYY-MM-DD, never defaulted); issued_on optional; classes
        defaults to [LMV].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expires_on
              properties:
                license_number:
                  type: string
                issuing_authority:
                  type: string
                issued_on:
                  type: string
                  description: YYYY-MM-DD
                expires_on:
                  type: string
                  description: YYYY-MM-DD, required
                classes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: License submitted for verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/offers:
    get:
      tags:
        - Drivers
      summary: List my pending dispatch offers
      description: Bearer auth, self only. Returns unexpired offers with status offered, newest first; empty array when none.
      responses:
        '200':
          description: Pending dispatch offers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    booking_id:
                      type: string
                    driver_id:
                      type: string
                    vehicle_id:
                      type: string
                    status:
                      type: string
                    offered_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/onboarding:
    get:
      tags:
        - Drivers
      summary: Get my driver onboarding state
      description: Bearer auth, self only (driver resolved from session user id or email, tenant-scoped). Returns current step
        plus per-area statuses.
      responses:
        '200':
          description: Onboarding state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver_id:
                    type: string
                  current_step:
                    type: string
                  identity_status:
                    type: string
                  license_status:
                    type: string
                  vehicle_status:
                    type: string
                  bank_status:
                    type: string
                  overall_status:
                    type: string
                  completed_steps:
                    type: array
                    items:
                      type: string
                  requirements:
                    type: array
                    items:
                      type: object
                  can_submit:
                    type: boolean
                  rejection_reason:
                    type: string
                  is_eligible:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/payout-account:
    post:
      tags:
        - Drivers
      summary: Submit my payout bank account
      description: Bearer auth, self only. Account must later be verified by a reviewer before payouts are eligible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_holder_name:
                  type: string
                account_number:
                  type: string
                ifsc_code:
                  type: string
                bank_name:
                  type: string
      responses:
        '201':
          description: Payout account stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  account_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/payouts:
    post:
      tags:
        - Settlements
      summary: Request a payout from my wallet
      description: Bearer auth, self only. idempotency_key is required (body or Idempotency-Key header); duplicate keys return
        200 with is_duplicate. Requires a verified payout account plus sufficient available balance above the minimum payout
        limit.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idempotency_key
                - amount
              properties:
                idempotency_key:
                  type: string
                amount:
                  type: number
      responses:
        '201':
          description: Payout initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payout_id:
                    type: string
                  driver_id:
                    type: string
                  amount:
                    type: number
                  status:
                    type: string
                  idempotency_key:
                    type: string
                  is_duplicate:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/push-token:
    post:
      tags:
        - Drivers
      summary: Register my push token
      description: Bearer auth, self only (driver_id defaults to caller). One of push_token/expo_push_token/token is required;
        platform defaults to android; device_id defaults to {platform}-{user_id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id:
                  type: string
                device_id:
                  type: string
                push_token:
                  type: string
                expo_push_token:
                  type: string
                token:
                  type: string
                platform:
                  type: string
                  default: android
      responses:
        '200':
          description: Push token registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/status:
    post:
      tags:
        - Drivers
      summary: Update my duty status
      description: Bearer auth, self only. status must be available, leave, or inactive; on_trip is system-controlled and rejected
        here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - available
                    - leave
                    - inactive
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver_id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/vehicle-claims:
    post:
      tags:
        - Drivers
      summary: Claim a vehicle
      description: Bearer auth, self only. registration_number is required; rc_document_id optionally links a previously uploaded
        RC document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_number
              properties:
                registration_number:
                  type: string
                rc_document_id:
                  type: string
      responses:
        '201':
          description: Claim filed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  claim_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/verification/submit:
    post:
      tags:
        - Drivers
      summary: Submit my onboarding for verification
      description: Bearer auth, self only. No body. Fails 400 until all onboarding requirements are satisfied.
      responses:
        '200':
          description: Application submitted for operational verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/me/wallet:
    get:
      tags:
        - Settlements
      summary: Get my driver wallet
      description: Bearer auth, self only (driver id resolved from session). Returns payable, pending, paid, and held balances
        plus recent ledger entries.
      responses:
        '200':
          description: Driver wallet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver_id:
                    type: string
                  available_balance:
                    type: number
                  pending_balance:
                    type: number
                  paid_balance:
                    type: number
                  held_balance:
                    type: number
                  currency:
                    type: string
                  recent_entries:
                    type: array
                    items:
                      type: object
                  updated_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/onboarding/funnel:
    get:
      tags:
        - Drivers
      summary: Get onboarding funnel snapshot
      description: Bearer auth, manager-facing tenant-wide drop-off snapshot (started/in_progress/submitted/approved/rejected
        plus stuck_by_step per canonical step).
      responses:
        '200':
          description: Funnel counts for the acting tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  started:
                    type: integer
                  in_progress:
                    type: integer
                  submitted:
                    type: integer
                  approved:
                    type: integer
                  rejected:
                    type: integer
                  stuck_by_step:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/push-token:
    post:
      tags:
        - Drivers
      summary: Register a push token (alias)
      description: Bearer auth. Alias of POST /api/v1/drivers/me/push-token handled by the same handler; same body and defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id:
                  type: string
                device_id:
                  type: string
                push_token:
                  type: string
                expo_push_token:
                  type: string
                token:
                  type: string
                platform:
                  type: string
                  default: android
      responses:
        '200':
          description: Push token registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/drivers/{id}/vehicle-assignments:
    post:
      tags:
        - Drivers
      summary: Assign a vehicle to a driver
      description: Reviewer only (admin or org_admin). assignment_type defaults to company_assigned.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id:
                  type: string
                assignment_type:
                  type: string
                  default: company_assigned
      responses:
        '201':
          description: Vehicle assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assignment_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/drivers/{id}/vehicle-claims/{claimId}/verify:
    post:
      tags:
        - Drivers
      summary: Review a vehicle claim
      description: Reviewer only (admin or org_admin). claimId path selects the claim; approve plus optional reason in body.
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Review recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/drivers/{id}/verify:
    post:
      tags:
        - Drivers
      summary: Review a driver license
      description: Reviewer only (admin or org_admin; drivers can never self-approve). license_id and approve are required;
        reason records rejections.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - license_id
              properties:
                license_id:
                  type: string
                approve:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Review recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/errors:
    get:
      tags: [Errors]
      summary: List error report groups
      description: Requires `errors:read` permission. Returns deduplicated error groups (fingerprint + tenant scoped).
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - name: fingerprint
          in: query
          schema: { type: string }
        - name: from
          in: query
          description: RFC3339 or YYYY-MM-DD, filters on last_seen.
          schema: { type: string }
        - name: to
          in: query
          description: RFC3339 or YYYY-MM-DD, filters on last_seen.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Error groups with total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorReport' }
                  total: { type: integer }
                  limit: { type: string }
                  offset: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/errors/client:
    post:
      tags: [Errors]
      summary: Report a client-side error
      description: Captures browser errors (message, stack, breadcrumbs, viewport) into the deduplicated error store. Authenticated users get their user id attached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                stack: { type: string }
                path: { type: string }
                user_agent: { type: string }
                viewport: { type: string }
                request_id: { type: string }
                breadcrumbs:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Report stored; returns error_id + correlation_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  error_id: { type: string }
                  correlation_id: { type: string }

  /api/v1/errors/incidents:
    get:
      tags: [Errors]
      summary: List incidents
      description: Requires `errors:read` permission.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, ASSIGNED, RESOLVED] }
      responses:
        '200':
          description: Incident list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/errors/incidents/{incidentID}/resolve:
    post:
      tags: [Errors]
      summary: Update an incident
      description: Requires `errors:update` permission. Sets status (OPEN/ASSIGNED/RESOLVED), assignee, and root cause.
      parameters:
        - name: incidentID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, ASSIGNED, RESOLVED] }
                assigned_to: { type: string }
                root_cause: { type: string }
      responses:
        '200':
          description: Incident updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/errors/{fingerprint}:
    get:
      tags: [Errors]
      summary: Get one error report group
      description: Requires `errors:read` permission. Powers the /ops/errors detail drawer.
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full error group detail (message, stack trace, metadata, occurrence stats).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReport' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/esg/reports/brsr:
    get:
      tags:
        - ESG
      summary: Get BRSR Principle 6 report
      description: Requires `esg:read` permission. Query `year` and `format` (json default, csv downloads attachment).
      parameters:
        - name: year
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum:
              - json
