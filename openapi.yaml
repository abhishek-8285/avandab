      description: Requires `esg:read` permission. Returns audited Scope 3 carbon metrics for one trip.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Carbon audit certificate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                  trip_number:
                    type: string
                  vehicle_number:
                    type: string
                  distance_km:
                    type: number
                  payload_tonnes:
                    type: number
                  cargo_tkm:
                    type: number
                  fuel_consumed_litres:
                    type: number
                  co2e_kg:
                    type: number
                  co2e_per_tkm:
                    type: number
