                  type: string
                app_version:
                  type: string
                os_version:
                  type: string
      responses:
        '201':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  installation_id:
                    type: string
                  driver_id:
                    type: string
                  vehicle_id:
                    type: string
                    nullable: true
                  session_type:
                    type: string
                  status:
                    type: string
                  start_reason:
                    type: string
                  started_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/snapshots:
    post:
      tags: [Telemetry]
      summary: Submit telemetry snapshot
      description: Requires bearer auth. Live vehicle telemetry snapshots.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySnapshotPayload'
      responses:
        '200':
          description: Snapshot stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/telemetry/stream:
    get:
      tags:
        - Telemetry
      summary: Live telemetry SSE stream
      description: 'Bearer auth, tenant-isolated fan-out. Optional `trip_id` / `vehicle_id` filters. 25s `: ping` keep-alive
        comments; slow consumers are dropped.'
