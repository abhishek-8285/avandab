openapi: 3.0.3
info:
  title: MVTMS REST API
  description: |
    OpenAPI specification for the MVTMS REST API v1. Authentication is via
    a signed Bearer token (`Authorization: Bearer <token>`) or an existing
    session cookie. The token endpoints are public; all other `/api/v1/*`
    routes require a valid principal plus Casbin RBAC permissions.
  version: "1.0.0"
  contact:
    name: MVTMS Support
    url: https://avandab.com
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Public token and registration endpoints.
  - name: Bookings
    description: Booking lifecycle management.
  - name: Trips
    description: Trip planning, assignment, and lifecycle.
  - name: Invoices
    description: Invoice generation and voiding.
  - name: Payments
    description: Payment recording, reversal, and Razorpay webhooks.
  - name: Profit & Loss
    description: Live trip P&L estimates.
  - name: Telemetry
    description: GPS log sync and telemetry snapshots.
  - name: Facilities
    description: Facilities endpoints.
  - name: Backhaul
    description: Backhaul endpoints.
  - name: STO
    description: STO endpoints.
  - name: LoadBoard
    description: LoadBoard endpoints.
  - name: Sharing
    description: Sharing endpoints.
  - name: FuelCards
    description: FuelCards endpoints.
  - name: ESG
    description: ESG endpoints.
  - name: Drivers
    description: Drivers endpoints.
  - name: Settlements
    description: Settlements endpoints.
  - name: Work Orders
    description: Work Orders endpoints.
  - name: Geofences
    description: Geofences endpoints.
  - name: Routes
    description: Routes endpoints.
  - name: Users
    description: Users endpoints.
  - name: Ops Alerts
    description: Ops Alerts endpoints.
  - name: Outbox
    description: Outbox endpoints.
  - name: SOS
    description: SOS endpoints.
  - name: ControlTower
    description: ControlTower endpoints.
  - name: Customer
    description: Customer endpoints.
  - name: Founder
    description: Founder endpoints.
  - name: Compliance
    description: Compliance endpoints.
  - name: Files
    description: Files endpoints.
  - name: Documents
    description: Documents endpoints.
  - name: Accounting
    description: Accounting endpoints.
  - name: Fuel
    description: Fuel endpoints.
  - name: Maintenance
    description: Maintenance endpoints.
  - name: Reports
    description: Reports endpoints.
  - name: Experiments
    description: Experiments endpoints.
  - name: Billing
    description: Billing endpoints.
  - name: Plans
    description: Commercial plan catalog and live pricing.
  - name: Errors
    description: Error reports and incidents.
  - name: Vehicles
    description: Vehicle registry and measurements.

paths:
  /api/driver/advances:
    get:
      tags:
        - Settlements
      summary: List my advance requests
      description: Bearer auth behind the driver_money feature flag; driver resolved from session.
      responses:
        '200':
          description: Advance requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  advances:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        trip_id:
                          type: string
                        amount:
                          type: number
                        reason:
                          type: string
                        status:
                          type: string
                        requested_at:
                          type: string
                          format: date-time
                        decided_by:
                          type: string
                        decided_at:
                          type: string
                          format: date-time
                        settlement_id:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Settlements
      summary: Request an advance
      description: Bearer auth behind the driver_money feature flag; driver resolved from session. amount must be positive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                trip_id:
                  type: string
                amount:
                  type: number
                reason:
                  type: string
      responses:
        '201':
          description: Advance requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/driver/advances/{id}/decision:
    post:
      tags:
        - Settlements
      summary: Decide an advance request
      description: Requires `kharcha:approve` permission (admin side) behind the driver_money feature flag. decision approve/reject
        with optional note; already-decided advances return 409.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/driver/balance:
    get:
      tags:
        - Settlements
      summary: Get my driver balance (Paisa tab)
      description: Bearer auth behind the driver_money feature flag; driver resolved from session. Running balance equals paid
        settlements minus paid advances plus approved advances; cached 60s per driver.
      responses:
        '200':
          description: Driver balance snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  running_balance:
                    type: number
                  last_settlement_id:
                    type: string
                  last_settlement_at:
                    type: string
                    format: date-time
                  pending_advances:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/driver/settlements:
    get:
      tags:
        - Settlements
      summary: List my settlements (Paisa tab)
      description: Bearer auth behind the driver_money feature flag; driver resolved from session. Latest 50 with id, period
        (trip_id), gross, deductions, net, status, tds, paid_at.
      responses:
        '200':
          description: Driver settlements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        period:
                          type: string
                        gross:
                          type: number
                        deductions:
                          type: number
                        net:
                          type: number
                        status:
                          type: string
                        tds:
                          type: number
                        paid_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/accounting/contacts/sync:
    post:
      tags:
        - Accounting
      summary: Sync contacts to accounting
      description: Requires `accounting:sync` permission. Pushes customer and driver contacts to the external accounting system;
        no request body.
      responses:
        '200':
          description: Contact sync result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: integer
                  failed:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounting/reconcile:
    get:
      tags:
        - Accounting
      summary: Reconcile accounting sync log
      description: Requires `accounting:read` permission. Compares local sync logs against acknowledged external ids; `unacked_refs`
        lists up to 50 unacked refs.
      responses:
        '200':
          description: Reconciliation summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  acked:
                    type: integer
                  unacked:
                    type: integer
                  unacked_refs:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounting/sync/status:
    get:
      tags:
        - Accounting
      summary: Get accounting sync status
      description: Requires `accounting:read` permission. Returns the adapter name, enabled flag, pending/failed event count,
        and last acked sync timestamp.
      responses:
        '200':
          description: Accounting sync health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter:
                    type: string
                  enabled:
                    type: boolean
                  pending_events:
                    type: integer
                  last_synced_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounting/sync/trigger:
    post:
      tags:
        - Accounting
      summary: Trigger accounting sync flush
      description: Requires `accounting:sync` permission. Retries pending/failed outbox events to the accounting adapter; optional
        `since_minutes` bounds the retry window (0 or omitted means all).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                since_minutes:
                  type: integer
      responses:
        '200':
          description: Sync flush result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispatched:
                    type: integer
                  failed:
                    type: integer
                  skipped_duplicates:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Public, rate-limited (10/min). Identical response whether or not the account exists (no enumeration). Queues
        the reset email via comm_outbox; `reset_link` is returned only in development without a mailer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset instructions sent (generic envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  reset_link:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/otp/send:
    post:
      tags:
        - Auth
      summary: Send phone OTP
      description: Public, rate-limited (5/min). Issues a 6-digit code (5-min TTL, 30s resend throttle) via SMS webhook. Generic
        `{ok:true}` envelope either way; `dev_code` is echoed only in development without an SMS sender.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: E.164 format
                  e.g. +919876543210.: null
      responses:
        '200':
          description: OTP send attempted (generic envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  dev_code:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify phone OTP
      description: Public, rate-limited (15/min). Checks the code and stamps `phone_verified_at` for matching users. Identical
        shape whether or not an account exists (no enumeration); 5 wrong tries invalidate the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Verification verdict.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Public self-registration. Only the `viewer` role can be requested;
        privileged roles must be assigned by an administrator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password with token
      description: Public, rate-limited (10/min). Redeems a single-use reset token and sets the new password. Invalid, expired,
        or replayed tokens are 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Issue API token
      description: Authenticate with email and password to receive a signed Bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Signed token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/backhaul/matches:
    get:
      tags:
        - Backhaul
      summary: Find backhaul matches
      description: Requires `trips:read` permission. Query requires `trip_id`; optional `radius_km` (default 50).
      parameters:
        - name: trip_id
          in: query
          required: true
          schema:
            type: string
        - name: radius_km
          in: query
          schema:
            type: number
            default: 50
      responses:
        '200':
          description: Candidate bookings with deadhead km, pickup distance, and freight margin.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    booking_id:
                      type: string
                    booking_number:
                      type: string
                    customer_name:
                      type: string
                    deadhead_km:
                      type: number
                    pickup_distance_km:
                      type: number
                    dropoff_distance_km:
                      type: number
                    freight_margin:
                      type: number
                    corridor_savings_pct:
                      type: number
                    price:
                      type: number
                    vehicle_type:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/backhaul/offers:
    post:
      tags:
        - Backhaul
      summary: Create backhaul dispatch offer
      description: Requires `trips:update` permission. Body requires `trip_id`, `booking_id`; optional `offered_rate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - booking_id
              properties:
                trip_id:
                  type: string
                booking_id:
                  type: string
                offered_rate:
                  type: number
      responses:
        '201':
          description: Dispatch offer created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id:
                    type: string
                  trip_id:
                    type: string
                  booking_id:
                    type: string
                  driver_id:
                    type: string
                  vehicle_id:
                    type: string
                  offered_rate:
                    type: number
                  status:
                    type: string
                  offered_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/billing/webhooks/razorpay:
    post:
      tags:
        - Billing
      summary: Razorpay subscription webhook
      description: Public webhook (no bearer; HMAC-SHA256 `X-Razorpay-Signature` verified when secret configured; mount has
        only rate limiting, no auth middleware). Body is the raw Razorpay event; plan ref travels in subscription `notes[plan_id]`;
        events without a subscription id return 200 `ignored_no_subscription`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                event_id:
                  type: string
                created_at:
                  type: integer
                payload:
                  type: object
      responses:
        '200':
          description: Webhook processed or ignored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      description: Requires `bookings:read` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/StatusParam'
      responses:
        '200':
          description: Paginated list of bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Bookings]
      summary: Create a booking
      description: Requires `bookings:create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get a booking
      description: Requires `bookings:read` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Bookings]
      summary: Update a booking
      description: Requires `bookings:update` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Booking updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Bookings]
      summary: Delete a booking
      description: Requires `bookings:delete` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: Booking deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking
      description: Requires `bookings:cancel` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}/complete:
    post:
      tags: [Bookings]
      summary: Complete a booking
      description: Requires `bookings:update` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}/confirm:
    post:
      tags: [Bookings]
      summary: Confirm a booking
      description: Requires `bookings:approve` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/compliance/dashboard:
    get:
      tags:
        - Compliance
      summary: Get compliance dashboard metrics
      description: Requires `compliance:read` permission. No params; driver/vehicle totals, blocked lists with reasons, pending
        document count.
      responses:
        '200':
          description: Compliance overview metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: object
                    properties:
                      total:
                        type: integer
                      blocked:
                        type: integer
                      expiring_soon:
                        type: integer
                  vehicles:
                    type: object
                    properties:
                      total:
                        type: integer
                      blocked:
                        type: integer
                      expiring_soon:
                        type: integer
                  blocked_drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        reason:
                          type: string
                  blocked_vehicles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        reason:
                          type: string
                  documents_pending:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/control-tower/trips:
    get:
      tags:
        - ControlTower
      summary: List control-tower trip projections
      description: Requires `trips:read` permission. Optional `status` filter; returns dispatcher projection array.
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Control-tower trip projections.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    trip_id:
                      type: string
                    trip_number:
                      type: string
                    tenant_id:
                      type: string
                    booking_id:
                      type: string
                    status:
                      type: string
                    start_time:
                      type: string
                      format: date-time
                    end_time:
                      type: string
                      format: date-time
                    origin:
                      type: string
