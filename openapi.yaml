                - service_type
              properties:
                plan_number:
                  type: string
                vehicle_id:
                  type: string
                measuring_point_id:
                  type: string
                service_type:
                  type: string
                description:
                  type: string
                cycle_interval_km:
                  type: number
                cycle_interval_days:
                  type: integer
                call_horizon_percent:
                  type: number
                last_scheduled_km:
                  type: number
                next_due_km:
                  type: number
      responses:
        '201':
          description: Maintenance plan created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  plan_number:
                    type: string
                  vehicle_id:
                    type: string
                  service_type:
                    type: string
                  status:
                    type: string
                  next_due_km:
                    type: number
                  next_due_date:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/maintenance/plans/{id}:
    get:
      tags:
        - Maintenance
      summary: Get one maintenance plan with live projection
      description: Requires `maintenance:read` permission. Path `id` is the plan id; unknown id returns 404. Returns plan plus
        current odometer, annual estimate, and projected due km/date with call-horizon flag.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Maintenance plan with projection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance_plan:
                    type: object
                  current_odometer:
                    type: number
                  annual_estimate:
                    type: number
                  projected_due_km:
                    type: number
                  projected_due_date:
                    type: string
                    format: date-time
                  call_horizon_due:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/maintenance/plans/{id}/evaluate:
    post:
      tags:
        - Maintenance
      summary: Evaluate a plan and trigger work order if due
      description: Requires `maintenance:update` permission. Path `id` is the plan id; empty body. Returns `call_triggered`
        true with the work order when the call horizon is breached, else `up_to_date`.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Evaluation outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  call_triggered:
                    type: boolean
                  work_order:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ops-alerts:
    get:
      tags:
        - Ops Alerts
      summary: List ops alerts
      description: Requires `ops_alerts:read` permission. Filters `status`, `type`, `severity` plus `page`/`limit` pagination.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - acknowledged
              - resolved
              - dismissed
        - name: type
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - critical
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        tenant_id:
                          type: string
                        alert_type:
                          type: string
                        severity:
                          type: string
                        title:
                          type: string
                        description: '{ type: string }'
                        entity_type:
                          type: string
                          nullable: true
                        entity_id:
                          type: string
                          nullable: true
                        status:
                          type: string
                        acknowledged_by:
                          type: string
                          nullable: true
                        acknowledged_at:
                          type: string
                          format: date-time
                          nullable: true
                        resolved_by:
                          type: string
                          nullable: true
                        resolved_at:
                          type: string
                          format: date-time
                          nullable: true
                        resolution_note:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops-alerts/generate:
    post:
      tags:
        - Ops Alerts
      summary: Create an ops alert manually
      description: Requires `ops_alerts:update` permission. `alert_type` and `title` are required; severity defaults to medium
        server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alert_type
                - title
              properties:
                alert_type:
                  type: string
                severity:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - critical
                title:
                  type: string
                description: '{ type: string }'
                entity_type:
                  type: string
                entity_id:
                  type: string
      responses:
        '201':
          description: Alert created open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert_id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops-alerts/{id}:
    get:
      tags:
        - Ops Alerts
      summary: Get an ops alert
      description: Requires `ops_alerts:read` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  alert_type:
                    type: string
                  severity:
                    type: string
                  title:
                    type: string
                  description: '{ type: string }'
                  status:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ops-alerts/{id}/acknowledge:
    post:
      tags:
        - Ops Alerts
      summary: Acknowledge an ops alert
      description: Requires `ops_alerts:update` permission. Only open alerts can be acknowledged; otherwise 409. Actor is the
        session user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  alert_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops-alerts/{id}/dismiss:
    post:
      tags:
        - Ops Alerts
      summary: Dismiss an ops alert
      description: Requires `ops_alerts:update` permission. Optional `reason` is recorded. Terminal alerts yield 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Alert dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  alert_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops-alerts/{id}/resolve:
    post:
      tags:
        - Ops Alerts
      summary: Resolve an ops alert
      description: Requires `ops_alerts:update` permission. Optional `note` is stored as the resolution note. Terminal alerts
        yield 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Alert resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  alert_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/outbox/batch:
    post:
      tags:
        - Outbox
      summary: Flush mobile outbox batch
      description: Bearer auth (no per-route permission gate in Register; durable insert into outbox_events in one Tx). Each
        command carries `idempotency_key` (PK, generated when absent), `command`, and `payload` string. Any Tx failure is 503
        so the client retries — never silent loss.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commands:
                  type: array
                  items:
                    type: object
                    properties:
                      idempotency_key:
                        type: string
                      command:
                        type: string
                      payload:
                        type: string
      responses:
        '200':
          description: Batch durably queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/payments:
    get:
      tags: [Payments]
      summary: List payments
      description: Requires `payments:read` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: method
          in: query
          schema:
            type: string
          description: Filter by payment method.
      responses:
        '200':
          description: Paginated list of payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Payments]
      summary: Record a payment
      description: Requires `payments:create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
      responses:
        '201':
          description: Payment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/by-invoice/{invoiceID}:
    get:
      tags: [Payments]
      summary: List payments for an invoice
      description: Requires `payments:read` permission.
      parameters:
        - name: invoiceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payments for the invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/payments/razorpay-order:
    post:
      tags:
        - Payments
      summary: Create a Razorpay order
      description: Requires `payments:create` permission. `invoice_id` is required; the amount is always derived server-side
        from the invoice balance (Spec 11 §5.1). 404 when the invoice is missing; 402 when it has no outstanding balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_id
              properties:
                invoice_id:
                  type: string
      responses:
        '200':
          description: Razorpay order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                  razorpay_key_id:
                    type: string
                  amount_paise:
                    type: integer
                  currency:
                    type: string
                  invoice_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/razorpay-webhook:
    post:
      tags: [Payments]
      summary: Razorpay webhook
      description: |
        Public Razorpay webhook. Verifies `X-Razorpay-Signature` and records
        `payment.captured` events idempotently.
      security: []
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayWebhookEvent'
      responses:
        '200':
          description: Webhook acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  payment_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/payments/razorpay-webhook/status:
    get:
      tags:
        - Payments
      summary: Get Razorpay webhook status
      description: Requires `payments:read` permission. Returns the last webhook received timestamp plus per-event-type counts.
      responses:
        '200':
          description: Webhook activity snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_received_at:
                    type: string
                    format: date-time
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/payments/razorpay/verify:
    post:
      tags:
        - Payments
      summary: Verify a Razorpay payment
      description: Requires `payments:create` permission. Validates the checkout signature and records the payment against the
        invoice balance. All four fields are required; a bad signature returns 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_id
                - order_id
                - payment_id
                - signature
              properties:
                invoice_id:
                  type: string
                order_id:
                  type: string
                payment_id:
                  type: string
                signature:
                  type: string
      responses:
        '201':
          description: Payment verified and recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  method:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment
      description: Requires `payments:read` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Payment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/{id}/reverse:
    post:
      tags: [Payments]
      summary: Reverse a payment
      description: Requires `payments:delete` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversePaymentRequest'
      responses:
        '201':
          description: Reversal payment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/plans:
    get:
      tags: [Plans]
      summary: List commercial plans
      description: Plan catalog with live prices (C3). Any authenticated caller.
      responses:
        '200':
          description: Plans ordered by price.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/plans/{id}:
    put:
      tags: [Plans]
      summary: Update plan price
      description: Live pricing without a migration; reactivates the plan. Requires `users:manage` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthly_price_inr]
              properties:
                monthly_price_inr:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: Price updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id:
                    type: string
                  monthly_price_inr:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pnl:
    get:
      tags:
        - Profit & Loss
      summary: Get daily P&L snapshots
      description: Requires `pnl:read` permission. Both `from` and `to` are required in YYYY-MM-DD; `to` must be >= `from`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily snapshots for the range (empty array, not null, when none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  tenant_id:
                    type: string
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        tenant_id:
                          type: string
                        snapshot_date:
                          type: string
                        revenue:
                          type: number
                        expenses:
                          type: number
                        fuel_costs:
                          type: number
                        driver_payouts:
                          type: number
                        maintenance:
                          type: number
                        toll_costs:
                          type: number
                        tds_deducted:
                          type: number
                        net_profit:
                          type: number
                        trip_count:
                          type: integer
                        vehicle_count:
                          type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/pnl/generate:
    post:
      tags:
        - Profit & Loss
      summary: Generate a P&L snapshot
      description: Requires `pnl:write` permission. Body `date` is YYYY-MM-DD and optional — defaults to yesterday. Idempotent
        per (tenant, date).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Snapshot generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  snapshot_date:
                    type: string
                  revenue:
                    type: number
                  expenses:
                    type: number
                  fuel_costs:
                    type: number
                  driver_payouts:
                    type: number
                  maintenance:
                    type: number
                  toll_costs:
                    type: number
                  tds_deducted:
                    type: number
                  net_profit:
                    type: number
                  trip_count:
                    type: integer
                  vehicle_count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/reports/breakdown:
    get:
      tags:
        - Reports
      summary: Breakdown and outstanding notifications report
      description: Requires `reports:read` permission. Pagination via `limit` (default 20, max 100) and `page` (1-based; offset
        derived). Merges vehicle-breakdown ops alerts with open work orders (job cards) as outstanding notifications.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Breakdown rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/reports/fuel-kmpl:
    get:
      tags:
        - Reports
      summary: Fuel and KMPL report (SAP ZMOTM_MR parity)
      description: Requires `reports:read` permission. Pagination via `limit` (default 20, max 100) and `page` (1-based; offset
        derived). KMPL is derived per vehicle from consecutive odometer readings divided by litres issued.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Fuel and KMPL rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/reports/kmpl-summary:
    get:
      tags:
        - Reports
      summary: KMPL summary report per vehicle and month (B13)
      description: Requires `reports:read` permission. Tank-to-tank method over `fuel_issues`
        odometer runs; `month` is `YYYY-MM` (default current month). Variance is computed
        against the vehicle's `standard_kmpl` norm; `BELOW_NORM` flags underperformers.
      parameters:
        - name: month
          in: query
          schema:
            type: string
            default: ''
        - name: vehicle_id
          in: query
          schema:
            type: string
            default: ''
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: KMPL summary rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  month:
                    type: string
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid month parameter.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/reports/gate-register:
    get:
      tags:
        - Reports
      summary: Gate register report (SAP ZMOTM_MR parity)
      description: Requires `reports:read` permission. Pagination via `q` (trip-number match), `limit` (default 20, max 100),
        `page` (1-based; offset derived). Distance prefers odometer delta, falling back to route distance on completed trips.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Gate register rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/reports/vehicle-master:
    get:
      tags:
        - Reports
      summary: Vehicle master report (SAP ZMOTM_MR parity)
      description: Requires `reports:read` permission. Pagination via `q`, `status`, `limit` (default 20, max 100), `page` (1-based;
        offset derived). Returns vehicle rows plus total/limit/offset.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Vehicle master rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicles:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/routes/optimize:
    post:
      tags:
        - Routes
      summary: Solve a route-optimization job
      description: Requires `routes:create` permission. Creates a pending job, solves synchronously (mock/OSRM, fallback on
        failure), and returns 202 with the completed result. Max 50 shipments. Optional `provider` overrides ROUTING_PROVIDER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipments
                - vehicles
              properties:
                shipments:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      latitude:
                        type: number
                      longitude:
                        type: number
                      demand:
                        type: number
                      time_window_start:
                        type: string
                        format: date-time
                      time_window_end:
                        type: string
                        format: date-time
                      skills:
                        type: array
                        items:
                          type: string
                vehicles:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      start_lat:
                        type: number
                      start_lng:
                        type: number
                      end_lat:
                        type: number
                      end_lng:
                        type: number
                      capacity:
                        type: number
                      skills:
                        type: array
                        items:
                          type: string
                constraints:
                  type: object
                  properties:
                    max_shipments_per_vehicle:
                      type: integer
                    max_route_duration_min:
                      type: integer
                    terrain_avoid:
                      type: array
                      items:
                        type: string
                provider:
                  type: string
      responses:
        '202':
          description: Job solved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  provider:
                    type: string
                  result:
                    type: object
                    properties:
                      routes:
                        type: array
                        items:
                          type: object
                          properties:
                            vehicle_id:
                              type: string
                            legs:
                              type: array
                              items:
                                type: object
                                properties:
                                  shipment_id:
                                    type: string
                                  distance_km:
                                    type: number
                                  duration_min:
                                    type: number
                                  sequence:
                                    type: integer
                            total_km:
                              type: number
                            total_min:
                              type: number
                      total_cost:
                        type: number
                      total_km:
                        type: number
                      solve_time_ms:
                        type: integer
                      provider_name:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/routes/optimize/jobs:
    get:
      tags:
        - Routes
      summary: List optimization jobs
      description: Requires `routes:read` permission. Last 20 jobs for the tenant, newest first.
      responses:
        '200':
          description: Recent jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                        provider:
                          type: string
                        created_at:
                          type: string
                        completed_at:
                          type: string
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/routes/optimize/jobs/{jobID}:
    get:
      tags:
        - Routes
      summary: Get optimization job status
      description: Requires `routes:read` permission. Polling endpoint; includes `result` when completed and `error` when failed.
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  provider:
                    type: string
                  created_at:
                    type: string
                  completed_at:
                    type: string
                  result:
                    type: object
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/settlements:
    get:
      tags:
        - Settlements
      summary: List settlements
      description: Requires `settlements:read` permission. Optional status and driver_id filters with limit/offset paging.
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: driver_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Matching settlements with count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlements:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settlements/calculate:
    post:
      tags:
        - Settlements
      summary: Calculate and create a settlement
      description: Bearer auth. Wallet/payout rail (statuses pending/calculated/approved/payable/paid); trip_id, driver_id,
        and tenant context are required. Idempotent per trip — returns the existing settlement when one already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - driver_id
              properties:
                trip_id:
                  type: string
                driver_id:
                  type: string
                gross_fare:
                  type: number
                toll_adjustment:
                  type: number
                advance_deductions:
                  type: number
                commission_rate:
                  type: number
                tds_rate:
                  type: number
      responses:
        '200':
          description: Settlement calculated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  trip_id:
                    type: string
                  driver_id:
                    type: string
                  gross_fare:
                    type: number
                  commission_amount:
                    type: number
                  toll_adjustment:
                    type: number
                  advance_deductions:
                    type: number
                  net_payout:
                    type: number
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/settlements/generate:
    post:
      tags:
        - Settlements
      summary: Generate a trip settlement
      description: 'Requires `settlements:write` permission. trip_id is required; force_recompute recalculates an existing settlement.
        Keyed error codes: trip_not_found (404), driver_not_assigned (409), booking_price_missing (422).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
              properties:
                trip_id:
                  type: string
                force_recompute:
                  type: boolean
      responses:
        '200':
          description: Settlement generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement_id:
                    type: string
                  trip_id:
                    type: string
                  driver_id:
                    type: string
                  gross_fare:
                    type: number
                  rate_model:
                    type: string
                  rate_basis:
                    type: object
                  commission_amount:
                    type: number
                  advances_kharcha:
                    type: number
                  approved_deductions:
                    type: number
                  performance_bonus:
                    type: number
                  tds_rate:
                    type: number
                  tds_amount:
                    type: number
                  net_payout:
                    type: number
                  status:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settlements/{id}:
    get:
      tags:
        - Settlements
      summary: Get a settlement by id
      description: Requires `settlements:read` permission. Returns the full settlement record with ledger lines.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Settlement detail.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settlements/{id}/confirm:
    post:
      tags:
        - Settlements
      summary: Confirm settlement payout received
      description: Requires `settlements:write` permission. Driver-side confirmation of a paid settlement.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Confirmation recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  confirmed_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settlements/{id}/deductions:
    get:
      tags:
        - Settlements
      summary: Get settlement deductions
      description: Requires `settlements:read` permission. Returns only advances/deduction/tds lines plus kharcha, deductions,
        and TDS totals.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Deduction breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement_id:
                    type: string
                  advances_kharcha:
                    type: number
                  approved_deductions:
                    type: number
                  tds_rate:
                    type: number
                  tds_amount:
                    type: number
                  lines:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settlements/{id}/dispute:
    post:
      tags:
        - Settlements
      summary: Dispute a settlement
      description: Requires `settlements:write` permission. reason is required; expected_net optionally states the driver's
        expected payout.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                expected_net:
                  type: number
      responses:
        '200':
          description: Dispute recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  dispute_reason:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settlements/{id}/mark-paid:
    post:
      tags:
        - Settlements
      summary: Mark a settlement paid
      description: Requires `settlements:approve` permission. payment_ref is required; paid_at accepts RFC3339 (defaults to
        now).
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_ref
              properties:
                payment_ref:
                  type: string
                paid_at:
                  type: string
                  format: date-time
                mode:
                  type: string
      responses:
        '200':
          description: Settlement marked paid.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/share/{token}/timeline:
    get:
      tags:
        - Sharing
      summary: Get public CX timeline
      description: Public (no auth). PII-masked timeline; driver phone masked, earnings omitted. Milestone enum ORDER_CREATED,
        VEHICLE_DISPATCHED, STOP_ARRIVED, IN_TRANSIT_CHECKPOINT, OUT_FOR_DELIVERY, DELIVERED_POD.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip timeline with milestones and polyline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                  trip_number:
                    type: string
                  status:
                    type: string
                  eta:
                    type: string
                    format: date-time
                  vehicle_label:
                    type: string
                  driver_name:
                    type: string
                  driver_phone:
                    type: string
                    description: Masked, e.g. +91 98*** **321
                  milestones:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - ORDER_CREATED
                            - VEHICLE_DISPATCHED
                            - STOP_ARRIVED
                            - IN_TRANSIT_CHECKPOINT
                            - OUT_FOR_DELIVERY
                            - DELIVERED_POD
                        title:
                          type: string
                        location:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                            - completed
                            - in_progress
                            - pending
                  polyline:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sos:
    post:
      tags:
        - SOS
      summary: Trigger driver SOS
      description: Bearer auth (driver session; `X-Driver-ID` header is the unauthenticated fallback). Missing trip/vehicle
        resolve from the driver's active trip. Idempotent on `command_id` — duplicates return 200 instead of 201.
      parameters:
        - name: X-Driver-ID
          in: header
          description: Driver id fallback when no session is present.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command_id:
                  type: string
                trip_id:
                  type: string
                vehicle_id:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                accuracy:
                  type: number
                battery_level:
                  type: number
                reason:
                  type: string
                triggered_at:
                  type: string
                  format: date-time
                occurred_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: SOS acknowledged and fanned out to the alert pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  sos_id:
                    type: string
                  driver_id:
                    type: string
                  vehicle_id:
                    type: string
                  received_at:
                    type: string
                    format: date-time
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sto:
    get:
      tags:
        - STO
      summary: List STOs
      description: Requires `sto:read` permission. Filter by `status`, paginated with `limit`/`offset`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - RELEASED
              - POSTED
              - ASSIGNED
              - IN_TRANSIT
              - RECEIVED
              - CANCELLED
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: STO list with total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - STO
      summary: Create STO draft
      description: Requires `sto:write` permission. Body requires `origin_facility_id`, `destination_facility_id`, `material_code`,
        `quantity`, `uom`, `required_delivery_date`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origin_facility_id
                - destination_facility_id
                - material_code
                - quantity
                - uom
                - required_delivery_date
              properties:
                origin_facility_id:
                  type: string
                destination_facility_id:
                  type: string
                material_code:
                  type: string
                material_description:
                  type: string
                quantity:
                  type: number
                uom:
                  type: string
                required_delivery_date:
                  type: string
                notes:
                  type: string
                created_by:
                  type: string
      responses:
        '201':
          description: STO draft created (status DRAFT).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  sto_number:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sto/{id}:
    get:
      tags:
        - STO
      summary: Get one STO
      description: Requires `sto:read` permission. Fetch STO by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: STO record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  sto_number:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sto/{id}/post-to-loadboard:
    post:
      tags:
        - STO
      summary: Post STO to load board
      description: Requires `sto:write` permission. Posts RELEASED STO; optional body (`vehicle_type_required`, `target_rate`,
        `max_rate`, `visibility`, `expires_hours`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_type_required:
                  type: string
                target_rate:
                  type: number
                max_rate:
                  type: number
                visibility:
                  type: string
                  enum:
                    - PRIVATE
                    - FEDERATED
                    - PUBLIC
                expires_hours:
                  type: integer
      responses:
        '201':
          description: Load board listing created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sto/{id}/release:
    post:
      tags:
        - STO
      summary: Release STO
      description: Requires `sto:write` permission. Transitions DRAFT STO to RELEASED; no body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: STO released.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/telemetry/devices/{imei}/gps:
    post:
      tags:
        - Telemetry
      summary: Device GPS ingest
      description: Public device endpoint — auth is the `X-Device-Token` header (HMAC-SHA256 of the provisioned secret), not
        Bearer. Unknown IMEI quarantines server-side (404); retired devices return 202 quarantined.
      security: []
      parameters:
        - name: imei
          in: path
          required: true
          schema:
            type: string
        - name: X-Device-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_time:
                  type: string
                  format: date-time
                latitude:
                  type: number
                longitude:
                  type: number
                speed:
                  type: number
                heading:
                  type: number
                ignition:
                  type: boolean
                accuracy:
                  type: number
                fuel_level:
                  type: number
                odometer:
                  type: number
                satellites:
                  type: integer
                battery_level:
                  type: number
                motion:
                  type: boolean
                valid:
                  type: boolean
                trip_id:
                  type: string
                driver_id:
                  type: string
                provider_msg_id:
                  type: string
      responses:
        '200':
          description: Frame accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  deduped:
                    type: boolean
        '202':
          description: Frame quarantined (retired device or pipeline quarantine).
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  quarantined:
                    type: boolean
                  reason:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/events:
    post:
      tags:
        - Telemetry
      summary: Ingest driver telemetry event
      description: Bearer auth (driver session). Validates coordinates (rejects 0,0 and out-of-range), rejects frames older
        than 7 days as STALE, and upserts the vehicle latest-position projection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                installation_id:
                  type: string
                client_event_id:
                  type: string
                occurred_at:
                  type: string
                  format: date-time
                latitude:
                  type: number
                longitude:
                  type: number
                accuracy_meters:
                  type: number
                speed_kmph:
                  type: number
                heading_degrees:
                  type: number
                battery_level_pct:
                  type: integer
                battery_state:
                  type: string
                trip_id:
                  type: string
      responses:
        '200':
          description: Ingest verdict (ACCEPTED, DUPLICATE, STALE, INVALID_SESSION, INVALID_COORDINATES).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  client_event_id:
                    type: string
                  event_id:
                    type: string
                  vehicle_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/geofences:
    get:
      tags:
        - Telemetry
      summary: Active geofence zones
      description: Bearer auth, tenant-scoped. No query params. Returns the tracking-map overlay zones.
      responses:
        '200':
          description: Active zones for the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    kind:
                      type: string
                    shape:
                      type: string
                    center_lat:
                      type: number
                    center_lng:
                      type: number
                    radius_m:
                      type: number
                    polygon:
                      type: array
                      items:
                        type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/history:
    get:
      tags:
        - Telemetry
      summary: Vehicle breadcrumb trail
      description: 'Bearer auth, tenant-scoped. Requires `vehicle_id` or `trip_id`. Params actually read: `vehicle_id`, `trip_id`,
        `from`/`to` (RFC3339), `limit` (default 500, cap 2000), `after`/`after_id` (keyset cursor), `minutes` (default 90, cap
        7 days; only when no `from` and no `trip_id`). Truncation signalled via X-Truncated / X-Next-From / X-Next-ID headers.'
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: string
        - name: trip_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
        - name: after
          in: query
          schema:
            type: string
            format: date-time
        - name: after_id
          in: query
          schema:
            type: string
        - name: minutes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10080
            default: 90
      responses:
        '200':
          description: Ordered breadcrumb points.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    lat:
                      type: number
                    lng:
                      type: number
                    speed:
                      type: number
                    ts:
                      type: string
                      format: date-time
                    heading:
                      type: number
                      nullable: true
                    odometer:
                      type: number
                      nullable: true
                    trip_id:
                      type: string
                    vehicle_id:
                      type: string
                    ignition:
                      type: boolean
                      nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/live:
    get:
      tags:
        - Telemetry
      summary: Live fleet markers
      description: 'Bearer auth, tenant-scoped. Query params actually read: `trip_id`, `bbox` (minLat,minLng,maxLat,maxLng),
        `since` (RFC3339) or `since_unix`, `q`/`search`, `envelope=true`. `If-None-Match` yields 304. `staleMin` is server config,
        not a query param.'
      parameters:
        - name: trip_id
          in: query
          schema:
            type: string
        - name: bbox
          in: query
          description: minLat,minLng,maxLat,maxLng viewport filter.
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339 delta-sync cutoff.
          schema:
            type: string
            format: date-time
        - name: since_unix
          in: query
          description: Unix-seconds delta-sync cutoff (used when `since` absent).
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: envelope
          in: query
          description: '''true'' wraps markers with sync metadata (server_time, totals, etag).'
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: Bare marker array, or `{meta, vehicles}` envelope when requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      server_time:
                        type: string
                        format: date-time
                      total_in_fleet:
                        type: integer
                      matched_count:
                        type: integer
                      etag:
                        type: string
                      active_count:
                        type: integer
                  vehicles:
                    type: array
                    items:
                      type: object
                      properties:
                        trip_id:
                          type: string
                        vehicle_id:
                          type: string
                        vehicle_number:
                          type: string
                        lat:
                          type: number
                        lng:
                          type: number
                        speed:
                          type: number
                        heading:
                          type: number
                          nullable: true
                        fuel_level:
                          type: number
                          nullable: true
                        odometer:
                          type: number
                          nullable: true
                        status:
                          type: string
                        battery_level:
                          type: number
                          nullable: true
                        motion:
                          type: boolean
                          nullable: true
                        driver_name:
                          type: string
                        driver_phone:
                          type: string
                        ts:
                          type: string
                          format: date-time
        '304':
          description: Fleet snapshot unchanged (If-None-Match hit).
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/playback:
    get:
      tags:
        - Telemetry
      summary: Enriched trip playback (query form)
      description: 'Bearer auth, tenant-scoped. Same handler as the trip path form; `trip_id` query is required here. Params:
        `trip_id`, `vehicle_id`, `limit` (default 2000, cap 5000), `from`/`to`, `after`/`after_id`.'
      parameters:
        - name: trip_id
          in: query
          required: true
          schema:
            type: string
        - name: vehicle_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 2000
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: after
          in: query
          schema:
            type: string
            format: date-time
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Points plus server-side distance summary, stops, geofence overlay and detention windows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                  vehicle_id:
                    type: string
                  points:
                    type: array
                    items:
                      type: object
                  summary:
                    type: object
                    properties:
                      total_points:
                        type: integer
                      returned_points:
                        type: integer
                      distance_km:
                        type: number
                      duration_seconds:
                        type: integer
                      avg_speed_kmh:
                        type: number
                      max_speed_kmh:
                        type: number
                  stops:
                    type: array
                    items:
                      type: object
                  geofence_events:
                    type: array
                    items:
                      type: object
                  detentions:
                    type: array
                    items:
                      type: object
                  truncated:
                    type: boolean
                  next_from:
                    type: string
                    format: date-time
                    nullable: true
                  next_id:
                    type: string
                  next_limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/reverse_geocode:
    get:
      tags:
        - Telemetry
      summary: Reverse-geocode a point
      description: Bearer auth. Caching Nominatim proxy; `lat` and `lng` are required. 503 when NOMINATIM_URL is not configured.
      parameters:
        - name: lat
          in: query
