<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Avandab - Driver Onboarding</title>
<!-- Tailwind compiled offline -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed-dim": "#bec6e0",
                      "surface-container-high": "#dce9ff",
                      "inverse-primary": "#6bd8cb",
                      "on-primary-container": "#f4fffc",
                      "surface": "#f8f9ff",
                      "primary-fixed-dim": "#6bd8cb",
                      "surface-container-low": "#eff4ff",
                      "tertiary-fixed-dim": "#c4c7c9",
                      "secondary-fixed": "#dae2fd",
                      "on-tertiary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#006a61",
                      "on-primary-fixed-variant": "#005049",
                      "on-error-container": "#93000a",
                      "on-primary": "#ffffff",
                      "surface-dim": "#cbdbf5",
                      "error-container": "#ffdad6",
                      "surface-variant": "#d3e4fe",
                      "on-secondary-container": "#5c647a",
                      "outline-variant": "#bcc9c6",
                      "primary-container": "#008378",
                      "secondary-container": "#dae2fd",
                      "tertiary": "#595c5e",
                      "surface-bright": "#f8f9ff",
                      "on-background": "#0b1c30",
                      "on-tertiary-fixed-variant": "#444749",
                      "on-secondary-fixed-variant": "#3f465c",
                      "surface-container": "#e5eeff",
                      "inverse-surface": "#213145",
                      "inverse-on-surface": "#eaf1ff",
                      "on-tertiary-fixed": "#191c1e",
                      "primary": "#0d9488", // overridden based on prompt instructions
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#d3e4fe",
                      "outline": "#6d7a77",
                      "secondary": "#565e74",
                      "tertiary-fixed": "#e0e3e5",
                      "background": "#f8f9ff",
                      "on-primary-fixed": "#00201d",
                      "on-secondary-fixed": "#131b2e",
                      "error": "#ba1a1a",
                      "on-error": "#ffffff",
                      "on-surface-variant": "#3d4947",
                      "on-surface": "#0b1c30",
                      "on-tertiary-container": "#fbfdff",
                      "tertiary-container": "#727577",
                      "primary-fixed": "#89f5e7"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "xl": "32px",
                      "touch-target-min": "44px",
                      "screen-margin": "16px",
                      "gutter": "12px",
                      "lg": "24px",
                      "xs": "4px",
                      "sm": "8px",
                      "base": "4px",
                      "md": "16px"
              },
              "fontFamily": {
                      "headline-md": ["Outfit"],
                      "label-caps": ["Plus Jakarta Sans"],
                      "label-sm": ["Plus Jakarta Sans"],
                      "headline-lg": ["Outfit"],
                      "body-lg": ["Plus Jakarta Sans"],
                      "data-display": ["Plus Jakarta Sans"],
                      "headline-sm": ["Outfit"],
                      "body-md": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "data-display": ["20px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar hiding for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-surface-bright text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center pt-safe pb-safe">
<!-- Mobile Container -->
<main class="w-full max-w-md min-h-[100dvh] bg-surface-bright relative flex flex-col">
<!-- Top App Bar / Header -->
<header class="w-full flex justify-between items-center px-screen-margin py-4">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-xl transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container active:scale-95 transition-transform duration-200 uppercase tracking-widest font-bold px-4 py-2" href="#">
                Skip
            </a>
</header>
<!-- Progress Indicator -->
<div class="w-full px-screen-margin mb-6">
<div class="h-1 bg-surface-variant rounded-full overflow-hidden flex">
<div class="h-full bg-primary w-1/3 rounded-full transition-all duration-500 ease-out"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-2 text-right">Step 1 of 3</p>
</div>
<!-- Content Area -->
<div class="flex-1 px-screen-margin flex flex-col">
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Driver Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide your details to start accepting rides.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg flex-1">
<!-- Input: Full Name -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 transition-colors group-focus-within:text-primary" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full h-[56px] pl-[44px] pr-4 bg-surface rounded-xl border border-outline-variant/30 text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200" id="fullName" placeholder="John Doe" type="text">
</div>
</div>
<!-- Input: Phone Number -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 transition-colors group-focus-within:text-primary" for="phone">Phone Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors" data-icon="call">call</span>
<input class="w-full h-[56px] pl-[44px] pr-4 bg-surface rounded-xl border border-outline-variant/30 text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200" id="phone" placeholder="+1 (555) 000-0000" type="tel">
</div>
</div>
<!-- Input: Vehicle Type -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 transition-colors group-focus-within:text-primary" for="vehicleType">Vehicle Type</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors z-10" data-icon="directions_car">directions_car</span>
<select class="appearance-none w-full h-[56px] pl-[44px] pr-10 bg-surface rounded-xl border border-outline-variant/30 text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200 cursor-pointer" id="vehicleType">
<option disabled="" selected="" value="">Select vehicle class</option>
<option value="sedan">Standard Sedan</option>
<option value="suv">SUV / Premium</option>
<option value="van">Multi-seater Van</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-on-surface-variant pointer-events-none transition-transform group-focus-within:rotate-180 duration-200" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<!-- Decorative Element showing 'high end UI pattern' instead of standard list -->
<div class="mt-4 p-4 rounded-xl bg-surface-container-low border border-outline-variant/20 flex gap-4 items-start">
<div class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="verified_user">verified_user</span>
</div>
<div>
<h4 class="font-headline-sm text-headline-sm text-on-surface mb-1">Secure Data</h4>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Your personal information is encrypted and securely stored according to regional regulations.</p>
</div>
</div>
<!-- Spacer to push button to bottom if screen is tall -->
<div class="flex-1 min-h-[40px]"></div>
</form>
</div>
<!-- Fixed Bottom Action -->
<div class="px-screen-margin pb-screen-margin pt-4 bg-surface-bright/90 backdrop-blur-md sticky bottom-0 border-t border-outline-variant/10 z-40">
<button class="w-full h-[56px] bg-primary hover:bg-primary-container text-on-primary font-label-caps text-label-caps rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200 shadow-[0_4px_12px_rgba(13,148,136,0.2)]" type="button">
<span>CONTINUE</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="mt-4 text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant/50 underline-offset-4" href="#">
                    Skip for now
                </a>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for input fields
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('active-field');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('active-field');
            });
        });
    </script>
</body></html>
