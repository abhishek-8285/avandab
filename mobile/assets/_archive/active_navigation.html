<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Navigation</title>
<!-- Tailwind compiled offline -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#444749",
                        "primary-fixed-dim": "#6bd8cb",
                        "outline": "#6d7a77",
                        "inverse-surface": "#213145",
                        "on-secondary-fixed": "#131b2e",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#dae2fd",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#727577",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary-container": "#fbfdff",
                        "surface": "#f8f9ff",
                        "background": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "primary-container": "#008378",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-primary-fixed-variant": "#005049",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#e0e3e5",
                        "on-secondary-fixed-variant": "#3f465c",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-fixed": "#89f5e7",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#00201d",
                        "tertiary": "#595c5e",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#5c647a",
                        "surface-container": "#e5eeff",
                        "on-tertiary-fixed": "#191c1e",
                        "surface-tint": "#006a61",
                        "on-background": "#0b1c30",
                        "surface-container-highest": "#d3e4fe",
                        "outline-variant": "#bcc9c6",
                        "on-surface-variant": "#3d4947",
                        "surface-variant": "#d3e4fe",
                        "surface-bright": "#f8f9ff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-container": "#f4fffc",
                        "error": "#ba1a1a",
                        "on-surface": "#0b1c30",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#6bd8cb",
                        "secondary-container": "#dae2fd",
                        "primary": "#00685f",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#bec6e0",
                        "secondary": "#565e74"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "screen-margin": "16px",
                        "base": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "touch-target-min": "44px",
                        "gutter": "12px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Outfit"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "data-display": ["Plus Jakarta Sans"],
                        "headline-sm": ["Outfit"],
                        "headline-md": ["Outfit"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "data-display": ["20px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .map-bg {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(rgba(226, 232, 240, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(226, 232, 240, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .nav-line {
            position: absolute;
            width: 8px;
            background-color: #0d9488;
            top: 40%;
            left: 50%;
            height: 30%;
            transform: translateX(-50%);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(13, 148, 136, 0.5);
        }

        .nav-marker {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background-color: #0d9488;
            border: 4px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
            z-index: 10;
        }
        
        .pulse-ring {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background-color: rgba(13, 148, 136, 0.2);
            border-radius: 50%;
            animation: pulse 2s infinite;
            z-index: 5;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md relative map-bg">
<!-- Top AppBar (from JSON, modified for map focus context - standard nav hidden per intent) -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md border-b border-outline-variant/30 flex justify-between items-center h-14 px-screen-margin glass-card">
<button class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<div class="font-headline-md text-primary font-bold">Avandab</div>
<button class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Simulated Map Elements -->
<div class="nav-line"></div>
<div class="pulse-ring"></div>
<div class="nav-marker"></div>
<div class="absolute top-[30%] left-[20%] w-[100px] h-[4px] bg-outline-variant/40 rounded-full rotate-45"></div>
<div class="absolute top-[60%] right-[30%] w-[150px] h-[6px] bg-surface-container-highest rounded-full -rotate-12"></div>
<div class="absolute top-[45%] left-[60%] w-[80px] h-[8px] bg-secondary-container rounded-full rotate-[70deg]"></div>
<!-- Map UI Overlay: Floating Header Instruction -->
<div class="fixed top-[72px] left-screen-margin right-screen-margin z-40">
<div class="glass-card rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">turn_left</span>
</div>
<div class="flex-1">
<p class="font-headline-lg text-on-surface">Left turn in 0.5 mi</p>
<p class="font-body-md text-on-surface-variant mt-xs">onto St Dunstan's Hill</p>
</div>
</div>
<!-- Speed/Limit Indicator -->
<div class="flex justify-end mt-sm">
<div class="glass-card rounded-lg px-sm py-xs flex items-center gap-xs shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-error-container">
<span class="font-data-display text-on-surface">32</span>
<span class="font-label-sm text-on-surface-variant">mph</span>
<div class="w-6 h-6 rounded-full border-2 border-error flex items-center justify-center bg-surface ml-xs">
<span class="font-label-sm font-bold text-on-surface">30</span>
</div>
</div>
</div>
</div>
<!-- Map UI Overlay: Floating Bottom Card -->
<div class="fixed bottom-0 left-0 w-full z-40 p-screen-margin pb-safe">
<div class="glass-card rounded-xl p-md shadow-[0px_-4px_24px_rgba(0,0,0,0.08)] flex flex-col gap-lg">
<div class="flex items-start justify-between gap-md">
<div class="flex-1">
<div class="flex items-center gap-xs mb-xs">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-caps text-on-surface-variant uppercase tracking-wider">Next Stop</span>
</div>
<h2 class="font-headline-sm text-on-surface truncate">4 St Dunstan's Hill</h2>
</div>
<div class="text-right shrink-0">
<p class="font-data-display text-primary">12<span class="font-label-sm text-primary">min</span></p>
<p class="font-label-sm text-on-surface-variant">7 km</p>
</div>
</div>
<button class="w-full h-[56px] bg-[#0d9488] hover:bg-primary-container/90 text-on-primary font-label-caps uppercase rounded-lg shadow-[0px_4px_12px_rgba(0,0,0,0.1)] active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
                Arrive at Stop
            </button>
</div>
</div>
<!-- Note: BottomNavBar is intentionally suppressed as this is a focused navigation task context, prioritizing map visibility over global navigation. -->
</body></html>
