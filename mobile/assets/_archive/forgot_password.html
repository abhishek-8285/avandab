<div class="bg-surface-container-lowest border border-border-subtle rounded p-8">
<div class="mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Forgot Password</h2>
<p class="font-body-md text-body-md text-text-muted">Enter your email to receive a password reset link.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-[8px]" for="email">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded font-body-md text-body-md text-on-surface py-2 px-3 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-text-muted/50" id="email" name="email" placeholder="you@company.com" required="" type="email">
</div>
<button class="w-full bg-brand-teal-deep text-on-primary font-data-mono text-data-mono py-[10px] px-4 rounded hover:bg-primary transition-colors flex items-center justify-center gap-2" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined text-[18px]" data-icon="send">send</span>
</button>
</form>
<div class="mt-6 text-center">
<a class="inline-flex items-center gap-1 font-body-sm text-body-sm text-text-muted hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>

</div>
