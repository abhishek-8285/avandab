<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Avandab - Sign In</title>

                        "primary-fixed-dim": "#6bd8cb",
                        "secondary-fixed": "#dae2fd"

                    "borderRadius": {

                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"

                    "spacing": {
                        "container-max": "100%",

<body class="bg-surface text-on-surface h-screen flex items-center justify-center p-4">
<!-- Login Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-border-subtle p-8 md:p-10 shadow-[0_4px_24px_rgba(0,0,0,0.02)]">
<!-- Header -->
<header class="mb-8 text-center">
<h1 class="font-display text-display text-primary mb-2">Avandab</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Logistics Management Portal</p>
</header>
<!-- Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md pl-10 pr-3 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant outline-none" id="email" name="email" placeholder="dispatcher@fleet.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md pl-10 pr-3 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant outline-none pr-10" id="password" name="password" placeholder="••••••••" required="" type="password">
<button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors flex items-center justify-center">
  <span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button></div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-data-mono text-data-mono py-3 px-4 transition-colors flex items-center justify-center gap-2 mt-4" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 flex items-center gap-4">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-caps text-label-caps text-outline uppercase">Or continue with</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- OAuth Buttons -->
<div class="space-y-3">
<button class="w-full bg-surface-container-lowest border border-outline-variant hover:bg-surface-container text-on-surface font-data-mono text-data-mono py-2.5 px-4 transition-colors flex items-center justify-center gap-3">
<!-- Using a simple SVG for Google icon as material symbols doesn't have brand icons -->
<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<button class="w-full bg-surface-container-lowest border border-outline-variant hover:bg-surface-container text-on-surface font-data-mono text-data-mono py-2.5 px-4 transition-colors flex items-center justify-center gap-3">
<svg class="w-5 h-5" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
<path d="M10 0H0v10h10V0z" fill="#f25022"></path>
<path d="M21 0H11v10h10V0z" fill="#7fba00"></path>
<path d="M10 11H0v10h10V11z" fill="#00a4ef"></path>
<path d="M21 11H11v10h10V11z" fill="#ffb900"></path>
</svg>
                Microsoft
            </button>
</div>
</main>


<script>
(function() {
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  const icon = toggleBtn.querySelector('.material-symbols-outlined');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    icon.textContent = isPassword ? 'visibility_off' : 'visibility';
    icon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
  });
})();
</script></body></html>
