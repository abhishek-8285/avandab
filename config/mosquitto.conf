# Mosquitto broker for GPS telemetry ingestion (Spec 01 §13.1)

# TCP listener — own GPS hardware devices
listener 1883
protocol mqtt

# WebSocket listener — mobile app (Spec 13)
listener 9001
protocol websockets

# Development: allow anonymous connections. Keep it — a laptop needs no
# provisioning, and the mobile app falls back to an anonymous connect when it
# holds no broker credential.
#
# Production ships config/mosquitto.prod.conf.example + config/mosquitto-acl:
# allow_anonymous false, password_file, acl_file. Driver credentials come from
# driver_mqtt_credentials (migration 00168) via
# scripts/mqtt-export-credentials.sh; verified on mosquitto 2.1.2.
allow_anonymous true

# Logging
log_dest stdout
log_type all
