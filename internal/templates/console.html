{{define "console.html"}}
<div class="space-y-5 max-w-[1600px] mx-auto">
    <div class="flex items-start justify-between gap-4 flex-wrap">
        <div class="min-w-0">
            <h1 class="text-[22px] sm:text-2xl font-bold tracking-tight text-on-surface font-display">Command Center</h1>
            <p class="text-sm text-secondary mt-1">Money, fleet and compliance in one view.</p>
        </div>
    </div>

    {{template "money_strip.html" .Extra}}

    <div class="grid grid-cols-1 lg:grid-cols-[240px_minmax(0,1fr)_320px] gap-4">
        {{template "fleet_strip.html" .Extra}}

        <div id="console-map-wrap" class="group relative bg-surface-container-lowest rounded-2xl border border-border-subtle shadow-sm overflow-hidden min-h-[420px] hover:shadow-md transition-shadow">
            <div id="console-map" class="w-full h-full min-h-[420px]"></div>
        </div>

        {{template "context_panel.html" .Extra}}
    </div>

    {{template "alert_inbox.html" .Extra}}

    <button id="palette-trigger" type="button"
            class="fixed bottom-5 right-5 z-40 inline-flex items-center gap-2 rounded-full bg-primary text-on-primary px-4 py-2.5 text-sm font-semibold shadow-lg hover:bg-primary/90 hover:-translate-y-px transition-all cursor-pointer border-0">
        Search <span class="text-[10px] opacity-80">⌘K</span>
    </button>

    <div id="search-palette" class="hidden fixed inset-0 z-50">
        <div id="palette-backdrop" class="absolute inset-0 bg-black/40"></div>
        <div class="relative mx-auto mt-24 w-[min(92vw,560px)] bg-surface-container-lowest border border-border-subtle rounded-2xl shadow-2xl overflow-hidden">
            <input id="palette-input" type="text" placeholder="Search vehicles, drivers, bookings, invoices, e-way bills…"
                   autocomplete="off"
                   class="w-full px-4 py-3 text-sm bg-transparent text-on-surface placeholder:text-text-muted outline-none border-b border-border-subtle" />
            <div id="palette-results" class="max-h-[50vh] overflow-y-auto p-2 text-sm text-text-muted">
                Type to search across the fleet.
            </div>
        </div>
    </div>
</div>

<script src="/static/js/console.js?v={{if .Version}}{{.Version}}{{else}}20260824{{end}}" defer></script>
{{end}}
