{{$action := .Action}}{{$label := .Label}}{{$icon := .Icon}}
<details class="group rounded-xl border border-border-subtle bg-surface-container-low/50 overflow-hidden">
    <summary class="cursor-pointer select-none list-none px-4 py-2.5 text-sm font-semibold text-primary hover:bg-primary/5 transition-colors flex items-center gap-2 [&::-webkit-details-marker]:hidden">
        <svg aria-hidden="true" class="w-4 h-4 shrink-0 transition-transform group-open:rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        {{if $icon}}{{icon $icon}}{{end}}
        <span>{{$label}}</span>
    </summary>
    <form method="post" action="{{$action}}" class="px-4 py-4 space-y-3 border-t border-border-subtle">
        <div>
            <label for="reason" class="block text-xs font-semibold text-secondary mb-1">Reason<span class="text-status-alert">*</span></label>
            <textarea aria-label="Why is this note being issued?" id="reason" name="reason" required rows="2" placeholder="Why is this note being issued?"
                class="w-full rounded-lg bg-surface-container-low border border-border-subtle px-3 py-2 text-on-surface text-sm placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition"></textarea>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div>
                <label for="taxable_value" class="block text-xs font-semibold text-secondary mb-1">Taxable Value (₹)</label>
                <input autocomplete="off" id="taxable_value" type="number" name="taxable_value" value="0" min="0" step="0.01"
                    class="w-full rounded-lg bg-surface-container-low border border-border-subtle px-3 py-2 text-on-surface text-sm tabular-nums focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
            </div>
            <div>
                <label for="igst" class="block text-xs font-semibold text-secondary mb-1">IGST (₹)</label>
                <input autocomplete="off" id="igst" type="number" name="igst" value="0" min="0" step="0.01"
                    class="w-full rounded-lg bg-surface-container-low border border-border-subtle px-3 py-2 text-on-surface text-sm tabular-nums focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
            </div>
            <div>
                <label for="cgst" class="block text-xs font-semibold text-secondary mb-1">CGST (₹)</label>
                <input autocomplete="off" id="cgst" type="number" name="cgst" value="0" min="0" step="0.01"
                    class="w-full rounded-lg bg-surface-container-low border border-border-subtle px-3 py-2 text-on-surface text-sm tabular-nums focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
            </div>
            <div>
                <label for="sgst" class="block text-xs font-semibold text-secondary mb-1">SGST (₹)</label>
                <input autocomplete="off" id="sgst" type="number" name="sgst" value="0" min="0" step="0.01"
                    class="w-full rounded-lg bg-surface-container-low border border-border-subtle px-3 py-2 text-on-surface text-sm tabular-nums focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
            </div>
        </div>
        <p class="text-xs text-text-muted">Credit notes reduce the invoice's taxable value and are capped at the invoice total minus prior credit notes; debit notes increase it.</p>
        <button type="submit"
            class="inline-flex items-center gap-2 rounded-full bg-primary text-on-primary px-4 py-2 text-sm font-semibold shadow-sm hover:bg-primary/90 active:scale-[0.98] transition cursor-pointer">
            Issue Note
        </button>
    </form>
</details>
