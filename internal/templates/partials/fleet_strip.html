{{define "fleet_strip.html"}}
{{/* Fleet strip (Spec 22 §4.1): color-coded vehicle cards, JS-refreshed. */}}
<section id="fleet-strip" data-selected="" class="min-w-0">
    <div class="bg-surface-container-lowest border border-border-subtle rounded-xl shadow-xs overflow-hidden">
        <div class="px-4 py-3 border-b border-border-subtle flex items-center justify-between gap-2">
            <h2 class="text-sm font-bold text-on-surface">Fleet</h2>
            <span id="fleet-count" class="px-2 py-0.5 rounded-full bg-surface-container border border-border-subtle text-xs font-bold tabular-nums text-text-muted"></span>
        </div>
        <div id="fleet-cards" class="p-2 flex flex-col gap-2 overflow-y-auto max-h-[70vh]">
            <p class="text-xs text-text-muted px-1">Loading fleet…</p>
        </div>
    </div>
</section>
{{end}}
