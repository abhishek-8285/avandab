{{$sf := ""}}{{if .StatusFilter}}{{$sf = .StatusFilter}}{{end}}
<form method="GET" action="{{.Action}}" data-filterbar class="px-4 py-2.5 border-b border-border-subtle flex flex-wrap items-center gap-2 bg-surface-container-lowest sticky top-0 z-10">
    {{range .Hidden}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">{{end}}
    <span class="text-[11px] font-bold tracking-wider uppercase text-text-muted mr-1">{{default "Filters:" .Label}}</span>
    {{range .Chips}}
    <a href="{{$.Action}}{{if .Value}}?status={{.Value}}{{end}}" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq $sf (default "" .Value)}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}}">{{.Label}}</a>
    {{end}}
    <div class="ml-auto flex items-center gap-2">
        {{if .ShowDates}}
        <div class="flex items-center gap-1.5 bg-surface-container-low border border-border-subtle rounded-full px-3 py-1.5 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/10 transition-all">
            <div class="relative">
                <input type="text" inputmode="numeric" name="{{default "from" .FromName}}" value="{{inDate .DateFrom}}" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off" aria-label="From date"
                    class="bg-transparent text-xs text-on-surface tabular-nums focus:outline-none w-[6.5rem] placeholder:text-text-muted/70">
                <input type="date" data-picker tabindex="-1" aria-hidden="true" value="{{if .DateFrom}}{{.DateFrom}}{{end}}"
                    class="absolute right-0 top-1/2 -translate-y-1/2 w-6 h-6 opacity-0 cursor-pointer m-0 p-0 border-0">
            </div>
            <span class="text-text-muted text-xs">→</span>
            <div class="relative">
                <input type="text" inputmode="numeric" name="{{default "to" .ToName}}" value="{{inDate .DateTo}}" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off" aria-label="To date"
                    class="bg-transparent text-xs text-on-surface tabular-nums focus:outline-none w-[6.5rem] placeholder:text-text-muted/70">
                <input type="date" data-picker tabindex="-1" aria-hidden="true" value="{{if .DateTo}}{{.DateTo}}{{end}}"
                    class="absolute right-0 top-1/2 -translate-y-1/2 w-6 h-6 opacity-0 cursor-pointer m-0 p-0 border-0">
            </div>
        </div>
        <button type="submit" class="inline-flex items-center px-3 py-1.5 rounded-full bg-surface-container-lowest border border-border-subtle text-xs font-semibold text-on-surface hover:bg-surface-container-low hover:border-primary/20 transition-all">Apply</button>
        {{end}}
        {{if .ShowSearch}}
        <div class="relative min-w-[180px] flex-1 sm:flex-none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" name="q" value="{{if .Query}}{{.Query}}{{end}}" placeholder="{{default "Search…" .SearchPlaceholder}}"
                class="bg-surface-container-low border border-border-subtle rounded-full py-2 pl-9 pr-4 text-sm text-on-surface placeholder:text-text-muted w-full focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
        </div>
        {{end}}
        {{with .Primary}}{{template "btn.html" .}}{{end}}
    </div>
</form>
{{if .ShowDates}}
<script>
    (function () {
        function toIN(iso) {
            if (!iso) return "";
            var p = iso.split("-");
            return p.length === 3 ? p[2] + "-" + p[1] + "-" + p[0] : iso;
        }
        function toISO(dmy) {
            var p = dmy.split(/[-\/]/);
            if (p.length !== 3 || p[0].length !== 2 || p[1].length !== 2 || p[2].length !== 4) return null;
            return p[2] + "-" + p[1] + "-" + p[0];
        }
        document.querySelectorAll("form[data-filterbar]").forEach(function (form) {
            if (form.__fbWired) return;
            form.__fbWired = true;
            var from = form.querySelector('input[name="from"]'), to = form.querySelector('input[name="to"]');
            if (!from || !to) return;
            var pickers = form.querySelectorAll("[data-picker]");
            pickers.forEach(function (pick, idx) {
                var txt = idx === 0 ? from : to;
                // Click anywhere on the hotspot opens that side's native calendar.
                pick.addEventListener("click", function () {
                    try { pick.showPicker(); } catch (e) { /* older browsers: native indicator still clickable */ }
                });
                pick.addEventListener("change", function () {
                    txt.value = toIN(pick.value);
                    if (idx === 0 && pick.value) { to.focus(); }
                });
            });
            form.addEventListener("submit", function () {
                [from, to].forEach(function (inp) {
                    var iso = toISO(inp.value);
                    if (iso) { inp.value = iso; return; }
                    if (inp.value && !/^\d{4}-\d{2}-\d{2}$/.test(inp.value)) inp.value = "";
                });
            });
        });
    })();
</script>
{{end}}
