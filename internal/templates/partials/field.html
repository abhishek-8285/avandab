<div class="mb-4">
  <label class="block text-xs font-semibold text-secondary mb-1">{{.Label}}{{if eq .Required "true"}}<span class="text-status-alert">*</span>{{end}}</label>
  <input type="{{if .Type}}{{.Type}}{{else}}text{{end}}" name="{{.Name}}" value="{{or .Value ""}}" placeholder="{{or .Placeholder ""}}"{{if eq .Required "true"}} required{{end}}{{if .Pattern}} pattern="{{.Pattern}}" title="{{or .Title ""}}"{{end}} class="w-full rounded-lg bg-surface-container-low border border-border-subtle px-3 py-2 text-on-surface text-sm placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
  {{if .Hint}}<p class="text-xs text-text-muted mt-1">{{.Hint}}</p>{{end}}
</div>
