<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{.Title}} - Avandab</title>
    {{template "seo_head.html" .}}
    <link rel="stylesheet" href="/static/css/fonts.css?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}">
    <script src="/static/js/loader.js?v=20260818" defer></script>
    <script src="/static/js/htmx.min.js?v={{if .Version}}{{.Version}}{{else}}20260822{{end}}" defer></script>
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{if .Version}}{{.Version}}{{else}}20260821{{end}}">
    <link rel="stylesheet" href="/static/css/app.css?v={{if .Version}}{{.Version}}{{else}}20260821{{end}}">
    {{template "theme_head.html" .}}

    <style>
        body {
            font-size: 1rem;
            line-height: 1.5;
            background-color: var(--color-background);
            color: var(--color-on-surface);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-display { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <script>
        document.documentElement.style.opacity = "1";
        document.addEventListener("DOMContentLoaded", function() {
            document.documentElement.style.opacity = "1";
        });
        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            if (!input) return;
            var visSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
            var visOffSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.59 9.59 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
            var isHidden = input.type === 'password';
            if (isHidden) {
                input.type = 'text';
                btn.innerHTML = visOffSVG;
            } else {
                input.type = 'password';
                btn.innerHTML = visSVG;
            }
        }
    </script>
    {{template "theme_head.html" .}}
</head>
<body class="bg-background font-sans antialiased min-h-screen flex flex-col" data-authenticated="false">
    <div class="flex-1 w-full flex flex-col">
        {{.Content}}
    </div>

    {{if .FlashError}}
    <aside id="flash-toast-error" class="flash-toast fixed bottom-4 right-4 safe-bottom safe-right max-w-md w-full bg-surface-container-lowest dark:bg-surface-container-low border border-border-subtle border-l-4 border-l-status-alert text-on-surface p-4 rounded-xl shadow-2xl flex items-start gap-3 z-50 transition-all duration-300" role="alert" aria-live="assertive">
        <div class="p-1.5 rounded-lg bg-status-alert/10 text-status-alert shrink-0 mt-0.5">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        </div>
        <div class="flex-1 min-w-0">
            <div class="text-xs font-bold text-status-alert uppercase tracking-wider mb-0.5">Notice</div>
            <div class="text-sm font-medium text-on-surface leading-snug break-words">{{.FlashError}}</div>
        </div>
        <button type="button" class="flash-dismiss text-text-muted hover:text-on-surface p-1 rounded-lg hover:bg-surface-container-high transition-colors flex items-center justify-center shrink-0 cursor-pointer border-0 bg-transparent" aria-label="Dismiss error" onclick="dismissFlashToast(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </aside>
    {{end}}

    {{if .FlashSuccess}}
    <aside id="flash-toast-success" class="flash-toast fixed bottom-4 right-4 safe-bottom safe-right max-w-md w-full bg-surface-container-lowest dark:bg-surface-container-low border border-border-subtle border-l-4 border-l-status-success text-on-surface p-4 rounded-xl shadow-2xl flex items-start gap-3 z-50 transition-all duration-300" role="status" aria-live="polite">
        <div class="p-1.5 rounded-lg bg-status-success/10 text-status-success shrink-0 mt-0.5">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="flex-1 min-w-0">
            <div class="text-xs font-bold text-status-success uppercase tracking-wider mb-0.5">Success</div>
            <div class="text-sm font-medium text-on-surface leading-snug break-words">{{.FlashSuccess}}</div>
        </div>
        <button type="button" class="flash-dismiss text-text-muted hover:text-on-surface p-1 rounded-lg hover:bg-surface-container-high transition-colors flex items-center justify-center shrink-0 cursor-pointer border-0 bg-transparent" aria-label="Dismiss message" onclick="dismissFlashToast(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </aside>
    {{end}}

    <script>
        function dismissFlashToast(el) {
            var toast = (el && el.closest) ? el.closest('.flash-toast') : (el ? el.parentElement : null);
            if (toast) {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                setTimeout(function() { toast.remove(); }, 250);
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            var toasts = document.querySelectorAll('.flash-toast');
            toasts.forEach(function(toast) {
                setTimeout(function() {
                    if (toast && toast.parentNode) {
                        dismissFlashToast(toast);
                    }
                }, 6000);
            });
        });
    </script>
    <script src="/static/js/theme.js?v={{if .Version}}{{.Version}}{{else}}20260820{{end}}"></script>
</body>
</html>
