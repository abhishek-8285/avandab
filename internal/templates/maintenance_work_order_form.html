<div class="max-w-3xl mx-auto">
    <div class="flex items-start justify-between gap-4 mb-5 flex-wrap">
        <div>
            <h1 class="text-[22px] sm:text-2xl font-bold tracking-tight text-on-surface font-display">New Job Card</h1>
            <p class="text-sm text-secondary mt-1">Open a work order between detection and completion — assignment and progress tracked to close.</p>
        </div>
    </div>

    <form method="POST" action="/maintenance/work-orders" class="bg-surface-container-lowest rounded-2xl border border-border-subtle shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-border-subtle flex items-center justify-between gap-3">
            <div>
                <h2 class="text-sm font-bold text-on-surface">Job Details</h2>
                <p class="text-xs text-text-muted mt-0.5">Vehicle and work to be done</p>
            </div>
        </div>
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-eyebrow text-text-muted mb-1.5">Vehicle ID <span class="text-status-alert">*</span></label>
                    <input type="text" name="vehicle_id" value="{{.VehicleID}}" required placeholder="e.g. veh-123"
                           class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                </div>
                <div>
                    <label class="block text-eyebrow text-text-muted mb-1.5">Due Date</label>
                    <input type="date" name="due_at"
                           class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface tabular-nums focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-eyebrow text-text-muted mb-1.5">Title <span class="text-status-alert">*</span></label>
                <input type="text" name="title" required placeholder="e.g. Brake pad replacement"
                       class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
            </div>

            <div>
                <label class="block text-eyebrow text-text-muted mb-1.5">Description</label>
                <textarea name="description" rows="3" placeholder="Symptoms, findings, parts needed…"
                          class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"></textarea>
            </div>

            <div class="pt-2">
                <h3 class="text-eyebrow text-text-muted border-b border-border-subtle pb-1 mb-3">Assignment & Cost</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-eyebrow text-text-muted mb-1.5">Assignee</label>
                        <input type="text" name="assignee" placeholder="e.g. Ramesh"
                               class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-eyebrow text-text-muted mb-1.5">Vendor</label>
                        <input type="text" name="vendor" placeholder="e.g. City Garage"
                               class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-eyebrow text-text-muted mb-1.5">Cost Estimate (₹)</label>
                        <input type="number" step="any" name="cost_estimate" placeholder="e.g. 4500"
                               class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface tabular-nums placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-eyebrow text-text-muted mb-1.5">Actual Cost (₹)</label>
                        <input type="number" step="any" name="cost_actual" placeholder="Fill on completion"
                               class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface tabular-nums placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                </div>
            </div>
        </div>

        <div class="px-6 py-3 border-t border-border-subtle bg-surface-container-low/40 flex justify-end gap-2">
            <a href="/maintenance" class="inline-flex items-center px-4 py-2 rounded-full bg-surface-container-lowest border border-border-subtle text-sm font-semibold text-on-surface hover:bg-surface-container-low transition-colors">Cancel</a>
            <button type="submit" class="inline-flex items-center px-5 py-2 rounded-full bg-primary text-on-primary text-sm font-semibold shadow-sm hover:bg-primary/90 hover:-translate-y-px transition-all cursor-pointer">Open Job Card</button>
        </div>
    </form>
</div>
