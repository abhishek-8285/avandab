{{if .Jobs}}
<div class="space-y-2">
  {{range .Jobs}}
  <div class="group flex items-center justify-between gap-3 border border-border-subtle rounded-xl px-3 py-2.5 bg-surface-container-low hover:bg-surface-container hover:border-primary/20 transition-all">
    <div class="min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-mono text-xs font-bold text-on-surface tabular-nums">{{slice .ID 0 8}}…</span>
        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-bold {{statusBadge .Status}}">{{.Status}}</span>
      </div>
      <div class="text-[11px] text-text-muted mt-0.5 tabular-nums">{{.Provider}} · {{.CreatedAt}}</div>
    </div>
    <a href="/routes/optimize/jobs/{{.ID}}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-lowest border border-border-subtle text-xs font-semibold text-primary hover:bg-primary hover:text-on-primary hover:border-primary transition-colors shrink-0">
      View
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 shrink-0"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
  {{end}}
</div>
{{else}}
<div class="py-8 text-center">
    <div class="w-10 h-10 rounded-full bg-surface-container grid place-items-center text-text-muted mx-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></div>
    <p class="text-xs font-medium text-on-surface mt-3">No jobs yet</p><p class="text-[11px] text-text-muted mt-0.5">Run an optimization to see results here.</p>
</div>
{{end}}
