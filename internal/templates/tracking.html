{{define "tracking.html"}}
<!-- Live fleet tracking — React island (src/tracking-island). The bundle owns
     the sidebar registry, Leaflet viewport, detail drawer, and the SSE +
     polling feed. Config below is the only server-rendered seam: tile
     provider (Spec 04 §2: OSM-only, attribution mandatory, no Google tile
     scraping), poll cadence, and tenant-scoped API endpoints. Session cookies
     ride along via same-origin fetch/EventSource; no tokens in markup. -->
<div id="tracking-root"
     class="w-full h-full min-h-[560px] relative overflow-hidden rounded-xl border border-border-subtle"
     data-config='{"Provider":{{json .MapConfig.Provider}},"GoogleStyle":{{json .MapConfig.GoogleStyle}},"OSMUrl":{{json .MapConfig.OSMUrl}},"PollSec":{{json .MapConfig.PollSec}},"LiveEndpoint":{{json .LiveEndpoint}},"StreamEndpoint":"/api/v1/telemetry/stream","GeofenceEndpoint":"/api/v1/telemetry/geofences","CanCreateVehicle":{{if can .User "vehicles" "create"}}true{{else}}false{{end}}}}'>
    <noscript>Live tracking requires JavaScript.</noscript>
</div>

<link rel="stylesheet" href="/static/tracking-island/tracking.bundle.css?v={{.Version}}" />
<script defer src="/static/tracking-island/tracking.bundle.js?v={{.Version}}"></script>
{{end}}
