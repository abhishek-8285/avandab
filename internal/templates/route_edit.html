<div class="max-w-3xl mx-auto space-y-5">
    <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
            <h1 class="text-[22px] sm:text-2xl font-bold tracking-tight text-on-surface font-display">{{if .Route}}Edit Route{{else}}New Route{{end}}</h1>
            <p class="text-sm text-secondary mt-1">Transport lane, distance, and standard tariff</p>
        </div>
        <a href="/routes" class="inline-flex items-center gap-2 rounded-full border border-border-subtle bg-surface-container-lowest px-4 py-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low transition-colors text-decoration-none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to Routes
        </a>
    </div>

    {{if .FlashError}}
    {{template "alert.html" (dict "Tone" "error" "Message" .FlashError)}}
    {{end}}

    {{ $route := .Route }}

    <form method="POST" action="/routes{{if $route}}/{{$route.ID}}/edit{{else}}/new{{end}}" class="bg-surface-container-lowest rounded-2xl border border-border-subtle shadow-sm overflow-hidden">
        <div class="p-6 space-y-6">
            <section>
                <h2 class="text-eyebrow text-text-muted border-b border-border-subtle pb-1 mb-3">Lane</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Source *</label>
                        <input type="text" name="source" value="{{if $route}}{{$route.Source}}{{end}}" required
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Destination *</label>
                        <input type="text" name="destination" value="{{if $route}}{{$route.Destination}}{{end}}" required
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-eyebrow text-text-muted border-b border-border-subtle pb-1 mb-3">Tariff</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Distance (km)</label>
                        <input type="number" step="0.1" name="distance" value="{{if $route}}{{$route.Distance}}{{end}}"
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface font-data-mono placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Est. Hours</label>
                        <input type="number" step="0.1" name="estimated_hours" value="{{if $route}}{{$route.EstimatedHours}}{{end}}"
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface font-data-mono placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Standard Fare</label>
                        <input type="number" step="0.01" name="standard_fare" value="{{if $route}}{{$route.StandardFare}}{{end}}"
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface font-data-mono placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-eyebrow text-text-muted border-b border-border-subtle pb-1 mb-3">Direction &amp; Reverse Leg</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Direction</label>
                        <select name="direction" class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                            <option value="oneway" {{if and $route (eq $route.Direction "oneway")}}selected{{end}}>One-way</option>
                            <option value="bidirectional" {{if and $route (eq $route.Direction "bidirectional")}}selected{{end}}>Bidirectional</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Reverse Distance (km)</label>
                        <input type="number" step="0.1" name="reverse_distance" value="{{if and $route $route.ReverseDistance}}{{index $route.ReverseDistance}}{{end}}" placeholder="optional"
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface font-data-mono placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Reverse Fare</label>
                        <input type="number" step="0.01" name="reverse_standard_fare" value="{{if and $route $route.ReverseStandardFare}}{{index $route.ReverseStandardFare}}{{end}}" placeholder="optional"
                            class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface font-data-mono placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-eyebrow text-text-muted border-b border-border-subtle pb-1 mb-3">Remarks</h2>
                <textarea name="remarks" rows="2"
                    class="w-full bg-surface-container-low border border-border-subtle rounded-lg px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">{{if $route}}{{nullString $route.Remarks}}{{end}}</textarea>
            </section>
        </div>

        <div class="sticky bottom-0 bg-surface-container-lowest border-t border-border-subtle px-6 py-3 flex justify-end gap-2 flex-wrap">
            <a href="/routes" class="inline-flex items-center justify-center rounded-full bg-surface-container-lowest border border-border-subtle px-4 py-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low transition-colors text-decoration-none">Cancel</a>
            <button type="submit" class="inline-flex items-center justify-center rounded-full bg-primary text-on-primary px-5 py-2 text-sm font-semibold shadow-sm hover:bg-primary/90 hover:-translate-y-px transition-all cursor-pointer">Save Route</button>
        </div>
    </form>
</div>
