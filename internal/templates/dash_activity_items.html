{{if .Stats.RecentActivity}}
<div class="relative">
    <div class="absolute left-2 top-2 bottom-2 w-px bg-border-subtle hidden sm:block"></div>
    <ul class="space-y-3">
        {{range .Stats.RecentActivity}}
        <li class="relative flex gap-3">
            <span class="hidden sm:grid w-4 h-4 rounded-full bg-primary/10 border border-primary/20 place-items-center shrink-0 mt-0.5"><span class="w-1.5 h-1.5 rounded-full bg-primary"></span></span>
            <div class="flex-1 min-w-0 bg-surface-container-low border border-border-subtle rounded-xl px-3 py-2.5 flex flex-wrap items-center gap-x-2 gap-y-1">
                <span class="text-sm font-bold text-on-surface">{{.UserName}}</span>
                <span class="text-sm text-secondary">{{.Action}}</span>
                {{if .TableName}}<span class="inline-flex px-1.5 py-0.5 rounded-full bg-surface-container border border-border-subtle text-[11px] font-semibold text-text-muted">{{.TableName}}</span>{{end}}
                <span class="text-xs text-text-muted ml-auto tabular-nums"><span class="time-display" data-utc-time="{{.CreatedAt.Format "2006-01-02T15:04:05Z07:00"}}">{{datetime .CreatedAt}}</span></span>
            </div>
        </li>
        {{end}}
    </ul>
</div>
{{else}}
<div class="py-8 text-center">
    <div class="w-10 h-10 rounded-full bg-surface-container grid place-items-center text-text-muted mx-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M12 22a9 9 0 1 0 0-18 9 9 0 0 0 0 18"/><path d="M12 7v5l3 3"/></svg></div>
    <p class="text-sm font-medium text-on-surface mt-3">No activity yet</p><p class="text-xs text-text-muted">Actions will appear here as your team works</p>
</div>
{{end}}
