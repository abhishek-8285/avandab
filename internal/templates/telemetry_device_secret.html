<div class="relative max-w-2xl mx-auto bg-surface-container-lowest rounded-2xl border border-border-subtle shadow-sm overflow-hidden">
    <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-amber-500 to-orange-500 opacity-80"></div>
    <div class="px-6 py-4 border-b border-border-subtle flex items-center gap-3">
        <span class="w-9 h-9 rounded-xl bg-primary/10 border border-primary/15 grid place-items-center text-primary shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3z"/></svg>
        </span>
        <div>
            <h3 class="text-sm font-bold text-on-surface font-display">Device Secret Provisioned</h3>
            <p class="text-xs text-text-muted">One-time display · never stored in plaintext</p>
        </div>
    </div>
    <div class="p-6 sm:p-8 space-y-5">
        <div class="rounded-xl bg-amber-500/10 border border-amber-500/20 p-3.5 flex items-start gap-2.5">
            <span class="w-6 h-6 rounded-lg bg-amber-500/15 grid place-items-center text-amber-600 shrink-0 mt-0.5">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </span>
            <p class="text-xs leading-relaxed text-secondary">
                Device <span class="font-data-mono font-bold text-on-surface">{{if .Device}}{{.Device.IMEI}}{{else}}unknown{{end}}</span> is now <strong class="text-status-success">active</strong>.
                Flash the secret below to the hardware. It is shown <strong class="text-amber-700 dark:text-amber-400">once</strong> and never stored in plaintext.
            </p>
        </div>

        <div>
            <label class="block text-eyebrow text-text-muted mb-1.5">Provisioning Secret</label>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                <code id="device-secret" class="flex-1 bg-surface-container-low border border-border-subtle rounded-lg p-3 font-data-mono text-xs font-bold text-on-surface break-all">{{.RawSecret}}</code>
                <button type="button" class="inline-flex items-center justify-center gap-2 rounded-full bg-primary text-on-primary px-4 py-2 text-sm font-semibold shadow-sm hover:bg-primary/90 hover:-translate-y-px transition-all shrink-0"
                    onclick="navigator.clipboard.writeText(document.getElementById('device-secret').textContent)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    Copy
                </button>
            </div>
        </div>

        <div class="pt-4 border-t border-border-subtle">
            <a href="/telemetry/devices" class="inline-flex items-center gap-1.5 rounded-full bg-surface-container-lowest border border-border-subtle px-4 py-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back to devices
            </a>
        </div>
    </div>
</div>
