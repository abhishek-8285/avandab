services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    # The app default DATABASE_URL is a bare relative path (CWD of the
    # process), which in this image is / — outside the ./data:/data mount,
    # so the DB would live on ephemeral container storage. Default to the
    # persistent path; an explicit DATABASE_URL (env or .env) still wins.
    # NOTE: a local .env that sets a relative file: URL bypasses /data —
    # point it at file:/data/<name>.db?... to keep data on the volume.
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/transport.db?mode=rwc&cache=shared&_foreign_keys=on&_journal_mode=WAL}
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    depends_on:
      - mosquitto
    restart: unless-stopped

  # MQTT broker for GPS telemetry ingestion
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # TCP for server-side own devices
      - "9001:9001"   # WebSocket for mobile app (Spec 13)
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  # Optional: SQLite file-based database (default in-memory)
  # If using SQLite file, uncomment the volume and set DATABASE_URL in .env

volumes:
  mosquitto_data:
