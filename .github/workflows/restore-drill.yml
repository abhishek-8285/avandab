name: Monthly Restore Drill

# Plan P5 §5.1: Monthly automated restore drill in CI.
# Proves that encrypted database backups are restorable, schema head matches,
# pragma integrity_check passes, and core business tables are populated.
on:
  schedule:
    - cron: '0 3 1 * *' # Monthly at 03:00 UTC on the 1st
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  restore-drill:
    name: Verify Encrypted Snapshot Restoreability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install SQLite3 + GnuPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 gnupg

      - name: Initialize & Migrate Seed Database
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          mkdir -p backups
          goose -dir db/migrations sqlite3 ./transport.db up

      - name: Generate ephemeral backup passphrase
        run: echo "BACKUP_ENCRYPTION_PASSPHRASE=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Run Online Encrypted Backup
        run: ./scripts/backup-db.sh ./transport.db ./backups

      - name: Assert artifact is encrypted only
        run: |
          ls -l backups
          test "$(ls backups/transport_*.db.gz.gpg 2>/dev/null | wc -l)" -eq 1
          test "$(ls backups/transport_*.db.gz 2>/dev/null | wc -l)" -eq 0
          echo "encrypted artifact only: OK"

      - name: Drill without passphrase must refuse
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ''
        run: |
          if ./scripts/restore-drill.sh "./backups/transport_*.db.gz.gpg" /tmp/drill-nopass; then
            echo "ERROR: drill restored an encrypted backup without a passphrase"
            exit 1
          fi
          echo "correctly refused without passphrase"

      - name: Execute Restore Drill
        run: ./scripts/restore-drill.sh "./backups/transport_*.db.gz.gpg"
