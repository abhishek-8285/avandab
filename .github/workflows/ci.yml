name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Backend Build & Vet (fast gate)
  # ──────────────────────────────────────────────────────────
  backend-build:
    name: Backend Build & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Format check
        run: |
          if [ "$(gofmt -l -s .)" != "" ]; then
            echo "::error::Code is not formatted: $(gofmt -l -s .)"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Security Regression Gate — RAG route auth mounting
        run: |
          if grep -n '^ragHandler.RegisterRoutes' cmd/server/main.go; then
            echo "::error::RAG routes registered at top level (unauthenticated) — must be inside the RequireAPIAuth-protected group"
            exit 1
          fi
          if ! grep -q '^[[:space:]].*ragHandler.RegisterRoutes' cmd/server/main.go; then
            echo "::error::No RAG route registration found inside the protected group"
            exit 1
          fi
          echo "RAG routes are registered inside the RequireAPIAuth-protected group."

      - name: Security Regression Gate — RAG directory allow-list
        run: |
          if ! grep -q 'allowedDirectory' internal/rag/handler.go; then
            echo "::error::handleIndex must enforce a directory allow-list (allowedDirectory)"
            exit 1
          fi
          echo "RAG directory indexing enforces an allow-list."

      - name: Security Regression Gate — No hardcoded tenant literals
        run: |
          HITS=$(grep -rn 'TenantID:[[:space:]]*"1"' internal/ cmd/ --include='*.go' | grep -v '_test.go:' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Hardcoded tenant literal found in non-test code — use shared.TenantIDFromContext(ctx) or shared.DefaultTenant"
            exit 1
          fi
          echo "No hardcoded tenant literals in production code. Tenant is always context-derived."

      - name: Tenant Isolation Lint
        run: ./scripts/tenant-lint.sh

      - name: Check CDN Tailwind references in templates
        run: |
          CDN_REFS=$(grep -rn 'cdn.tailwindcss.com' internal/templates/ || true)
          if [ -n "$CDN_REFS" ]; then
            echo "::error::CDN Tailwind references found in templates: $CDN_REFS"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Job 2: Backend Tests & Coverage (depends on build)
  # ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Tests + coverage (single pass, shuffled)
        # Was: separate coverage run + -count=3 full runs + duplicated mobile
        # coverage (~20min). Now one -count=1 pass with the honest app-wide
        # profile; shuffle still proves test isolation. Flake-hunting moved
        # to the weekly flake-watch workflow. Mobile coverage: Mobile job.
        run: ./scripts/check-coverage.sh

      - name: Audit shared state
        run: |
          ./scripts/audit-shared-state.sh > audit-results.txt
          TEST_VARS=$(sed -n '/--- Package-level vars in _test.go files ---/,/--- Global caches/p' audit-results.txt | grep -E '\.go:[0-9]+:var ' || true)
          if [ -n "$TEST_VARS" ]; then
            echo "::error::Package-level mutable state found in test files:"
            echo "$TEST_VARS"
            exit 1
          fi
          echo "✅ Shared state audit passed — zero package-level variables in test files."

      - name: SQLC generate check
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          PATH="$(go env GOPATH)/bin:$PATH" make generate
          # Tracked-only: prior steps leave untracked artifacts
          # (audit-results.txt); those must not fail this gate.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::sqlc generated files are out of date"
            git diff --exit-code
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Job 3: Security Scanners (parallel with tests)
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Scanners
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Fetch base for lint ratchet
        run: git fetch origin master --depth=1 || true

      - name: Run Security Scanners
        run: LINT_BASE=origin/master ./scripts/security-check.sh

      - name: Tenant Isolation Lint
        run: ./scripts/tenant-lint.sh

      - name: Legacy Freeze Lint
        run: ./scripts/legacy-freeze.sh

  # ──────────────────────────────────────────────────────────
  # Job 4: Mobile (fully independent, parallel with backend)
  # ──────────────────────────────────────────────────────────
  mobile:
    name: Mobile Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage

      - name: Build (export)
        run: npm run build
        env:
          EXPO_PUBLIC_API_SCHEME: https
          EXPO_PUBLIC_BACKEND_HOST: api.avandab.com
          EXPO_PUBLIC_API_PORT: '443'

  # ──────────────────────────────────────────────────────────
  # Job 5: Docker Build
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mvtms:latest .

  # ──────────────────────────────────────────────────────────
  # Job 6: Integration Gate (depends on all above)
  # ──────────────────────────────────────────────────────────
  integration:
    name: Integration Gate
    runs-on: ubuntu-latest
    needs: [backend-test, security, mobile, docker-build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Security scanners failed"
            exit 1
          fi
          if [[ "${{ needs.mobile.result }}" != "success" ]]; then
            echo "❌ Mobile checks failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          echo "✅ All CI gates passed"

  # Job 7: PG parity — migrations_pg must apply cleanly on empty PG
  pg-parity:
    name: PG Parity (migrations_pg)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Migrate empty PG to latest (goose, two-phase)
        run: |
          GOOSE="go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir db/migrations_pg postgres $DATABASE_URL"
          # Two-phase migrate mirroring cmd/server startup (A7): explicit-id
          # seeds desync identity sequences, so migrate to just before the
          # first generated insert, resync, then go. Single-pass `up` dies
          # at 00137 on fresh chains (roles_pkey).
          $GOOSE up-to 72
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT setval('roles_id_seq', (SELECT COALESCE(MAX(id), 0) FROM roles), true);" -c "SELECT setval('permissions_id_seq', (SELECT COALESCE(MAX(id), 0) FROM permissions), true);"
          $GOOSE up
          $GOOSE version
      - name: Migration tests + PG proof
        run: |
          go test ./db/... ./internal/database/... ./internal/datamigrate/...
          go test -tags pg_integration ./internal/database/ ./internal/datamigrate/ -count=1