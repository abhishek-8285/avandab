name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Backend Build & Vet (fast gate)
  # ──────────────────────────────────────────────────────────
  backend-build:
    name: Backend Build & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Format check
        run: |
          if [ "$(gofmt -l -s .)" != "" ]; then
            echo "::error::Code is not formatted: $(gofmt -l -s .)"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Security Regression Gate — RAG route auth mounting
        run: |
          if grep -n '^ragHandler.RegisterRoutes' cmd/server/main.go; then
            echo "::error::RAG routes registered at top level (unauthenticated) — must be inside the RequireAPIAuth-protected group"
            exit 1
          fi
          if ! grep -q '^[[:space:]].*ragHandler.RegisterRoutes' cmd/server/main.go; then
            echo "::error::No RAG route registration found inside the protected group"
            exit 1
          fi
          echo "RAG routes are registered inside the RequireAPIAuth-protected group."

      - name: Security Regression Gate — RAG directory allow-list
        run: |
          if ! grep -q 'allowedDirectory' internal/rag/handler.go; then
            echo "::error::handleIndex must enforce a directory allow-list (allowedDirectory)"
            exit 1
          fi
          echo "RAG directory indexing enforces an allow-list."

      - name: Security Regression Gate — No hardcoded tenant literals
        run: |
          HITS=$(grep -rn 'TenantID:[[:space:]]*"1"' internal/ cmd/ --include='*.go' | grep -v '_test.go:' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Hardcoded tenant literal found in non-test code — use shared.TenantIDFromContext(ctx) or shared.DefaultTenant"
            exit 1
          fi
          echo "No hardcoded tenant literals in production code. Tenant is always context-derived."

      - name: Tenant Isolation Lint
        run: ./scripts/tenant-lint.sh

      - name: Check CDN Tailwind references in templates
        run: |
          CDN_REFS=$(grep -rn 'cdn.tailwindcss.com' internal/templates/ || true)
          if [ -n "$CDN_REFS" ]; then
            echo "::error::CDN Tailwind references found in templates: $CDN_REFS"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Job 2: Backend Tests & Coverage (depends on build)
  # ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Coverage Gate (80% minimum threshold)
        run: ./scripts/check-coverage.sh

      - name: Test isolation (shuffle)
        run: go test -shuffle=on -count=3 ./internal/... ./test/...

      - name: Audit shared state
        run: |
          ./scripts/audit-shared-state.sh > audit-results.txt
          TEST_VARS=$(sed -n '/--- Package-level vars in _test.go files ---/,/--- Global caches/p' audit-results.txt | grep -E '\.go:[0-9]+:var ' || true)
          if [ -n "$TEST_VARS" ]; then
            echo "::error::Package-level mutable state found in test files:"
            echo "$TEST_VARS"
            exit 1
          fi
          echo "✅ Shared state audit passed — zero package-level variables in test files."

      - name: SQLC generate check
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::sqlc generated files are out of date"
            git diff --exit-code
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Job 3: Security Scanners (parallel with tests)
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Scanners
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Fetch base for lint ratchet
        run: git fetch origin master --depth=1 || true

      - name: Run Security Scanners
        run: LINT_BASE=origin/master ./scripts/security-check.sh

      - name: Tenant Isolation Lint
        run: ./scripts/tenant-lint.sh

  # ──────────────────────────────────────────────────────────
  # Job 4: Mobile (fully independent, parallel with backend)
  # ──────────────────────────────────────────────────────────
  mobile:
    name: Mobile Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage

      - name: Build (export)
        run: npm run build
        env:
          EXPO_PUBLIC_API_SCHEME: https
          EXPO_PUBLIC_BACKEND_HOST: api.avandab.com
          EXPO_PUBLIC_API_PORT: '443'

  # ──────────────────────────────────────────────────────────
  # Job 5: Docker Build
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mvtms:latest .

  # ──────────────────────────────────────────────────────────
  # Job 6: Integration Gate (depends on all above)
  # ──────────────────────────────────────────────────────────
  integration:
    name: Integration Gate
    runs-on: ubuntu-latest
    needs: [backend-test, security, mobile, docker-build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Security scanners failed"
            exit 1
          fi
          if [[ "${{ needs.mobile.result }}" != "success" ]]; then
            echo "❌ Mobile checks failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          echo "✅ All CI gates passed"